<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Microsoft YaHei, Segoe UI, sans-serif">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f766e"/><stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="760" fill="#ffffff"/>
  <rect width="1200" height="104" fill="url(#hdr)"/>
  <text x="40" y="52" fill="#ffffff" font-size="30" font-weight="700">业务编排与自动化（BOAT）· 一张图概述</text>
  <text x="40" y="82" fill="#d3f5f0" font-size="15">Business Orchestration &amp; Automation Technologies — 重点技术专题（ZT031 · v3.0）</text>

  <!-- 定义 -->
  <g>
    <rect x="30" y="130" width="555" height="180" rx="12" fill="#f1faf9" stroke="#c4ece6"/>
    <rect x="30" y="130" width="6" height="180" rx="3" fill="#14b8a6"/>
    <text x="56" y="162" font-size="20" font-weight="700" fill="#0f766e">定义与内涵</text>
    <text x="56" y="194" font-size="14" fill="#334155">Gartner 于 2025 年 10 月确立的整合型平台类别：在单一平台内</text>
    <text x="56" y="218" font-size="14" fill="#334155">融合业务流程编排、企业连接、低代码开发与智能体自动化能力，</text>
    <text x="56" y="242" font-size="14" fill="#334155">横跨 BPA/RPA/iPaaS/低代码/IDP/智能体六个原有市场。</text>
    <text x="56" y="278" font-size="13.5" fill="#64748b">TRL 5 · 优先级 中 · 战略重要度 7.8/10 · 论证层/系统论证</text>
  </g>

  <!-- 关键技术 -->
  <g>
    <rect x="615" y="130" width="555" height="180" rx="12" fill="#f1faf9" stroke="#c4ece6"/>
    <rect x="615" y="130" width="6" height="180" rx="3" fill="#2dd4bf"/>
    <text x="641" y="162" font-size="20" font-weight="700" fill="#0f766e">关键技术能力</text>
    <g font-size="14" fill="#334155">
      <text x="641" y="194">• 统一数据模型、设计器与运行时</text>
      <text x="641" y="218">• 业务流程编排（BPA）与状态管理</text>
      <text x="641" y="242">• 智能体自动化（AI 驱动自主流程）</text>
      <text x="641" y="266">• 集成平台（iPaaS）与 API 编排</text>
      <text x="641" y="290">• 智能文档处理（IDP）与低代码</text>
    </g>
  </g>

  <!-- 应用 -->
  <g>
    <rect x="30" y="330" width="555" height="180" rx="12" fill="#f6fbf9" stroke="#c8ecd9"/>
    <rect x="30" y="330" width="6" height="180" rx="3" fill="#10b981"/>
    <text x="56" y="362" font-size="20" font-weight="700" fill="#065f46">典型应用场景</text>
    <g font-size="14" fill="#334155">
      <text x="56" y="394">• 存量 RPA/流程平台/集成总线整合</text>
      <text x="56" y="418">• 授信审批、客户开户端到端自动化</text>
      <text x="56" y="442">• 后交易系统微服务化编排（巴克莱）</text>
      <text x="56" y="466">• KYC 流程自动化（宁士银行省 80% 工时）</text>
      <text x="56" y="490">• 员工服务自动化（渣打年省 10.4 万工时）</text>
    </g>
  </g>

  <!-- 趋势挑战 -->
  <g>
    <rect x="615" y="330" width="555" height="180" rx="12" fill="#fffaf3" stroke="#fde6c8"/>
    <rect x="615" y="330" width="6" height="180" rx="3" fill="#f59e0b"/>
    <text x="641" y="362" font-size="20" font-weight="700" fill="#92400e">发展趋势与挑战</text>
    <g font-size="14" fill="#334155">
      <text x="641" y="394">趋势：2025 年 70 亿→2029 年 210 亿美元，CAGR 33.9%</text>
      <text x="641" y="418">趋势：2030 年 70% 企业转向整合自动化平台</text>
      <text x="641" y="442">挑战：能力融合度须 POC 实测，不能仅凭厂商文档</text>
      <text x="641" y="466">挑战：跨系统流程断点与重复运维成本</text>
      <text x="641" y="490">研判：维持"论证层"定档，先启动资产地图盘点</text>
    </g>
  </g>

  <rect x="30" y="545" width="1140" height="86" rx="12" fill="#0f172a"/>
  <text x="60" y="578" font-size="16" font-weight="700" fill="#ffffff">研判结论</text>
  <text x="60" y="608" font-size="14" fill="#cbd5e1">以零采购的自动化资产地图盘点为先行动作，用统一平台替代碎片化工具拼接，消除重复投入与流程断点。</text>
  <text x="1170" y="610" text-anchor="end" font-size="13" fill="#64748b">前沿技术研究组 · 专题报告 ZT031</text>
</svg>
