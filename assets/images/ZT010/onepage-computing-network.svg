<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Microsoft YaHei, Segoe UI, sans-serif">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1e3a8a"/><stop offset="1" stop-color="#4f8cff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="760" fill="#ffffff"/>
  <rect width="1200" height="104" fill="url(#hdr)"/>
  <text x="40" y="52" fill="#ffffff" font-size="30" font-weight="700">算力网络 · 一张图概述</text>
  <text x="40" y="82" fill="#cfe0ff" font-size="15">Compute Network — 重点技术专题（ZT010 · v4.0）</text>

  <!-- 定义 -->
  <g>
    <rect x="30" y="130" width="555" height="180" rx="12" fill="#f4f8ff" stroke="#dbe7ff"/>
    <rect x="30" y="130" width="6" height="180" rx="3" fill="#4f8cff"/>
    <text x="56" y="162" font-size="20" font-weight="700" fill="#1e3a8a">定义与内涵</text>
    <text x="56" y="194" font-size="14" fill="#334155">以国家"东数西算"工程为主干、以《算力互联互通行动计划》</text>
    <text x="56" y="218" font-size="14" fill="#334155">为标准化路径的新型基础设施形态，实现算力资源跨地域、</text>
    <text x="56" y="242" font-size="14" fill="#334155">跨主体的统一编排调度；工程已由"建设期"转入"规模运营期"。</text>
    <text x="56" y="278" font-size="13.5" fill="#64748b">TRL 7 · 优先级 中 · 战略重要度 7.5/10 · 研究层/深入研究</text>
  </g>

  <!-- 关键技术 -->
  <g>
    <rect x="615" y="130" width="555" height="180" rx="12" fill="#f4f8ff" stroke="#dbe7ff"/>
    <rect x="615" y="130" width="6" height="180" rx="3" fill="#22d3ee"/>
    <text x="641" y="162" font-size="20" font-weight="700" fill="#1e3a8a">关键技术现状</text>
    <g font-size="14" fill="#334155">
      <text x="641" y="194">• 八大枢纽算力总规模 215.5 EFLOPS（智算占比超八成）</text>
      <text x="641" y="218">• 算力互联互通与统一编排调度</text>
      <text x="641" y="242">• 跨域任务级调度（仍受技术/商业约束）</text>
      <text x="641" y="266">• 算电协同与绿色算力</text>
      <text x="641" y="290">• 20 毫秒时延圈基本实现</text>
    </g>
  </g>

  <!-- 应用 -->
  <g>
    <rect x="30" y="330" width="555" height="180" rx="12" fill="#f6fbf9" stroke="#c8ecd9"/>
    <rect x="30" y="330" width="6" height="180" rx="3" fill="#10b981"/>
    <text x="56" y="362" font-size="20" font-weight="700" fill="#065f46">典型应用场景</text>
    <g font-size="14" fill="#334155">
      <text x="56" y="394">• 东部算力需求向西部枢纽疏导</text>
      <text x="56" y="418">• 智算中心建设（建行贵安 113 亿元等）</text>
      <text x="56" y="442">• 同业"西部选址＋算力租用"参与路径</text>
      <text x="56" y="466">• 金融监管鼓励按需布局自主可控算力底座</text>
      <text x="56" y="490">• 负载合规分级与算力需求测算</text>
    </g>
  </g>

  <!-- 趋势挑战 -->
  <g>
    <rect x="615" y="330" width="555" height="180" rx="12" fill="#fffaf3" stroke="#fde6c8"/>
    <rect x="615" y="330" width="6" height="180" rx="3" fill="#f59e0b"/>
    <text x="641" y="362" font-size="20" font-weight="700" fill="#92400e">发展趋势与挑战</text>
    <g font-size="14" fill="#334155">
      <text x="641" y="394">趋势：枢纽集群进入规模运营、算电协同入政府工作报告</text>
      <text x="641" y="418">挑战：芯片异构适配难</text>
      <text x="641" y="442">挑战：跨域网络成本可能抵消电价优势</text>
      <text x="641" y="466">挑战：毫秒级抖动即可导致计算失败</text>
      <text x="641" y="490">研判：维持"研究层/深入研究"定档</text>
    </g>
  </g>

  <rect x="30" y="545" width="1140" height="86" rx="12" fill="#0f172a"/>
  <text x="60" y="578" font-size="16" font-weight="700" fill="#ffffff">研判结论</text>
  <text x="60" y="608" font-size="14" fill="#cbd5e1">不将有限资源投入尚未成熟的跨域调度环节，以"选址布局＋算力租用"两个低风险动作获取成本与韧性收益。</text>
  <text x="1170" y="610" text-anchor="end" font-size="13" fill="#64748b">前沿技术研究组 · 专题报告 ZT010</text>
</svg>
