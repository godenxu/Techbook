<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Microsoft YaHei, Segoe UI, sans-serif">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1e3a8a"/><stop offset="1" stop-color="#4f8cff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="760" fill="#ffffff"/>
  <rect width="1200" height="104" fill="url(#hdr)"/>
  <text x="40" y="52" fill="#ffffff" font-size="30" font-weight="700">生成式人工智能 · 一张图概述</text>
  <text x="40" y="82" fill="#cfe0ff" font-size="15">Generative Artificial Intelligence — 重点技术专题</text>

  <!-- 定义 -->
  <g>
    <rect x="30" y="130" width="555" height="180" rx="12" fill="#f4f8ff" stroke="#dbe7ff"/>
    <rect x="30" y="130" width="6" height="180" rx="3" fill="#4f8cff"/>
    <text x="56" y="162" font-size="20" font-weight="700" fill="#1e3a8a">定义与内涵</text>
    <text x="56" y="194" font-size="14.5" fill="#334155">以大模型为核心，通过学习海量数据中的分布规律，</text>
    <text x="56" y="218" font-size="14.5" fill="#334155">自动生成文本、图像、音视频、代码等内容的人工智能技术，</text>
    <text x="56" y="242" font-size="14.5" fill="#334155">正从「感知智能」迈向「认知与创造智能」。</text>
    <text x="56" y="278" font-size="13.5" fill="#64748b">TRL 8 · 优先级 高 · 战略重要度 9.5/10</text>
  </g>

  <!-- 关键技术 -->
  <g>
    <rect x="615" y="130" width="555" height="180" rx="12" fill="#f4f8ff" stroke="#dbe7ff"/>
    <rect x="615" y="130" width="6" height="180" rx="3" fill="#22d3ee"/>
    <text x="641" y="162" font-size="20" font-weight="700" fill="#1e3a8a">关键技术</text>
    <g font-size="14" fill="#334155">
      <text x="641" y="194">• 大模型预训练与对齐（RLHF/DPO）</text>
      <text x="641" y="218">• 多模态理解与生成</text>
      <text x="641" y="242">• 检索增强生成（RAG）与长上下文</text>
      <text x="641" y="266">• 高效推理与端侧部署</text>
      <text x="641" y="290">• 智能体（Agent）与工具调用</text>
    </g>
  </g>

  <!-- 应用 -->
  <g>
    <rect x="30" y="330" width="555" height="180" rx="12" fill="#f6fbf9" stroke="#c8ecd9"/>
    <rect x="30" y="330" width="6" height="180" rx="3" fill="#10b981"/>
    <text x="56" y="362" font-size="20" font-weight="700" fill="#065f46">典型应用场景</text>
    <g font-size="14" fill="#334155">
      <text x="56" y="394">• 智能办公与内容生产</text>
      <text x="56" y="418">• 医疗辅助与药物研发</text>
      <text x="56" y="442">• 自动驾驶与具身智能</text>
      <text x="56" y="466">• 科学发现（材料/分子/代码）</text>
      <text x="56" y="490">• 工业质检与知识服务</text>
    </g>
  </g>

  <!-- 趋势挑战 -->
  <g>
    <rect x="615" y="330" width="555" height="180" rx="12" fill="#fffaf3" stroke="#fde6c8"/>
    <rect x="615" y="330" width="6" height="180" rx="3" fill="#f59e0b"/>
    <text x="641" y="362" font-size="20" font-weight="700" fill="#92400e">发展趋势与挑战</text>
    <g font-size="14" fill="#334155">
      <text x="641" y="394">趋势：能力泛化、成本下降、垂直行业渗透</text>
      <text x="641" y="418">挑战：算力自主与高端芯片卡点</text>
      <text x="641" y="442">挑战：幻觉与可信度、安全治理</text>
      <text x="641" y="466">挑战：数据合规与知识产权</text>
      <text x="641" y="490">研判：优先布局、重点投入</text>
    </g>
  </g>

  <rect x="30" y="545" width="1140" height="86" rx="12" fill="#0f172a"/>
  <text x="60" y="578" font-size="16" font-weight="700" fill="#ffffff">研判结论</text>
  <text x="60" y="608" font-size="14" fill="#cbd5e1">在大模型基础能力、算力自主与安全治理三条线同步发力，抢占生成式人工智能战略制高点。</text>
  <text x="1170" y="610" text-anchor="end" font-size="13" fill="#64748b">前沿技术研究组 · 样例</text>
</svg>
