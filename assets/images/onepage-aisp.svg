<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Microsoft YaHei, Segoe UI, sans-serif">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4c1d95"/><stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="760" fill="#ffffff"/>
  <rect width="1200" height="104" fill="url(#hdr)"/>
  <text x="40" y="52" fill="#ffffff" font-size="30" font-weight="700">人工智能安全平台（AISP）· 一张图概述</text>
  <text x="40" y="82" fill="#e9dcff" font-size="15">AI Security Platform / AI TRiSM — 重点技术专题（ZT018 · v2.1）</text>

  <!-- 定义 -->
  <g>
    <rect x="30" y="130" width="555" height="180" rx="12" fill="#f7f4ff" stroke="#e2d8ff"/>
    <rect x="30" y="130" width="6" height="180" rx="3" fill="#8b5cf6"/>
    <text x="56" y="162" font-size="20" font-weight="700" fill="#4c1d95">定义与内涵</text>
    <text x="56" y="194" font-size="14" fill="#334155">覆盖 AI 可信、风险与安全管理的框架与工程能力：提示注入防护、</text>
    <text x="56" y="218" font-size="14" fill="#334155">数据与输出护栏、模型评估、运行时异常检测与 AI 治理平台；</text>
    <text x="56" y="242" font-size="14" fill="#334155">思想源头为 Gartner 提出的 AI TRiSM 框架。</text>
    <text x="56" y="278" font-size="13.5" fill="#64748b">TRL 5 · 优先级 高 · 战略重要度 9.0/10 · 论证层/系统论证</text>
  </g>

  <!-- 关键技术 -->
  <g>
    <rect x="615" y="130" width="555" height="180" rx="12" fill="#f7f4ff" stroke="#e2d8ff"/>
    <rect x="615" y="130" width="6" height="180" rx="3" fill="#a78bfa"/>
    <text x="641" y="162" font-size="20" font-weight="700" fill="#4c1d95">关键技术能力</text>
    <g font-size="14" fill="#334155">
      <text x="641" y="194">• 提示注入防护与内容安全</text>
      <text x="641" y="218">• 模型评估与红队测试</text>
      <text x="641" y="242">• 数据/输出护栏与可观测性</text>
      <text x="641" y="266">• AI 资产台账与运行时异常检测</text>
      <text x="641" y="290">• AI 治理平台（立项到上线全流程）</text>
    </g>
  </g>

  <!-- 应用 -->
  <g>
    <rect x="30" y="330" width="555" height="180" rx="12" fill="#f6fbf9" stroke="#c8ecd9"/>
    <rect x="30" y="330" width="6" height="180" rx="3" fill="#10b981"/>
    <text x="56" y="362" font-size="20" font-weight="700" fill="#065f46">典型应用场景</text>
    <g font-size="14" fill="#334155">
      <text x="56" y="394">• 智能体规模化落地的前置护栏</text>
      <text x="56" y="418">• 影子 AI 治理（78% 用户使用未批准工具）</text>
      <text x="56" y="442">• 银行 AI 全生命周期治理（DBS 1500+ 模型）</text>
      <text x="56" y="466">• 监管合规（金融监管总局指导意见）</text>
      <text x="56" y="490">• AI 安全事件应急响应</text>
    </g>
  </g>

  <!-- 趋势挑战 -->
  <g>
    <rect x="615" y="330" width="555" height="180" rx="12" fill="#fffaf3" stroke="#fde6c8"/>
    <rect x="615" y="330" width="6" height="180" rx="3" fill="#f59e0b"/>
    <text x="641" y="362" font-size="20" font-weight="700" fill="#92400e">发展趋势与挑战</text>
    <g font-size="14" fill="#334155">
      <text x="641" y="394">趋势：AI 安全整合进主流平台（五起并购超 15 亿美元）</text>
      <text x="641" y="418">趋势：市场 2025 年 29.1 亿→2034 年 173 亿美元</text>
      <text x="641" y="442">挑战：提示注入与深度伪造成头部威胁</text>
      <text x="641" y="466">挑战：安全治理能力滞后于应用落地</text>
      <text x="641" y="490">研判：维持"论证层"定档，先行护栏 POC</text>
    </g>
  </g>

  <rect x="30" y="545" width="1140" height="86" rx="12" fill="#0f172a"/>
  <text x="60" y="578" font-size="16" font-weight="700" fill="#ffffff">研判结论</text>
  <text x="60" y="608" font-size="14" fill="#cbd5e1">AISP 是智能体规模化落地的前置护栏，具有强制属性而非效率工具属性；建议以 AI 资产台账与试点场景护栏 POC 即刻启动。</text>
  <text x="1170" y="610" text-anchor="end" font-size="13" fill="#64748b">前沿技术研究组 · 专题报告 ZT018</text>
</svg>
