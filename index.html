<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>银行金融科技前沿技术研究成果 · 电子研究书</title>
<style>
/* ============================ 基础与主题变量 ============================ */
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --radius: 14px;
  --font: "Segoe UI", "Microsoft YaHei", "PingFang SC", "Source Han Sans SC", system-ui, sans-serif;
  --mono: "Cascadia Code", "Consolas", "Courier New", monospace;
  --topbar-h: 58px;
}
[data-theme="dark"] {
  --bg: #0b111e; --bg2: #0e1524;
  --panel: #141f33; --panel2: #1a2740; --card: #172136;
  --border: #263651; --border2: #33486b;
  --text: #dbe6f5; --dim: #8fa3c0; --faint: #64789a;
  --accent: #4f8cff; --accent2: #22d3ee;
  --good: #34d399; --warn: #fbbf24; --bad: #fb7185;
  --paper: #16223a; --paper2: #1b2944;
  --shadow: 0 20px 60px rgba(0,0,0,.55);
  --shadow-sm: 0 6px 20px rgba(0,0,0,.35);
  --glow: 0 0 24px rgba(79,140,255,.25);
}
[data-theme="light"] {
  --bg: #e8edf5; --bg2: #dfe6f0;
  --panel: #ffffff; --panel2: #f4f7fb; --card: #ffffff;
  --border: #dbe2ee; --border2: #c2cde0;
  --text: #1b2537; --dim: #54637f; --faint: #8a99b4;
  --accent: #2f6bff; --accent2: #0ea5c4;
  --good: #059669; --warn: #d97706; --bad: #e11d48;
  --paper: #fdfefe; --paper2: #f4f6fa;
  --shadow: 0 20px 60px rgba(40,60,100,.28);
  --shadow-sm: 0 6px 20px rgba(40,60,100,.16);
  --glow: 0 0 24px rgba(47,107,255,.18);
}
html, body { height: 100%; }
body {
  font-family: var(--font);
  background: radial-gradient(1200px 600px at 15% -10%, var(--bg2), var(--bg)) fixed;
  color: var(--text);
  overflow: hidden;
  transition: background .4s, color .4s;
}
button { font-family: var(--font); cursor: pointer; }
.hidden { display: none !important; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 8px; }
::-webkit-scrollbar-track { background: transparent; }

/* ============================ 顶栏 ============================ */
.topbar {
  height: var(--topbar-h); display: flex; align-items: center; gap: 14px;
  padding: 0 18px; border-bottom: 1px solid var(--border);
  background: linear-gradient(180deg, var(--panel), transparent);
  backdrop-filter: blur(10px); position: relative; z-index: 50;
}
.brand { display: flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; }
.brand-icon {
  width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: #fff; font-weight: 700; font-size: 17px; box-shadow: var(--glow);
}
.brand-title { font-weight: 700; font-size: 15px; letter-spacing: .5px; }
.brand-sub { font-size: 11px; color: var(--dim); }
.search-wrap { flex: 1; max-width: 460px; position: relative; }
.search-wrap input {
  width: 100%; height: 38px; border-radius: 20px; border: 1px solid var(--border);
  background: var(--card); color: var(--text); padding: 0 16px; font-size: 13px; outline: none;
}
.search-wrap input:focus { border-color: var(--accent); box-shadow: var(--glow); }
.search-results {
  position: absolute; top: 44px; left: 0; right: 0; background: var(--panel);
  border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow-sm);
  max-height: 340px; overflow: auto; z-index: 100;
}
.search-item { padding: 10px 14px; cursor: pointer; display: flex; gap: 10px; align-items: center; }
.search-item:hover { background: var(--panel2); }
.search-item .si-name { font-weight: 600; font-size: 13px; }
.search-item .si-cat { font-size: 11px; color: var(--accent2); }
.search-item .si-sum { font-size: 12px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.topbar-actions { display: flex; gap: 8px; margin-left: auto; }
.btn {
  height: 36px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--card); color: var(--text); font-size: 13px; transition: .2s;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.active { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: var(--glow); }
.mode-btn { min-width: 52px; }

/* ============================ 视图容器 ============================ */
.view { position: absolute; top: var(--topbar-h); left: 0; right: 0; bottom: 0; }

/* ============================ 书 ============================ */
.book-stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
.book {
  position: relative; width: min(1500px, 80vw); height: calc(100vh - var(--topbar-h) - 60px);
}
.book-page {
  position: absolute; top: 0; height: 100%; width: 50%;
  background: var(--paper); overflow: hidden;
  border: 1px solid var(--border);
}
#pageLeft  { left: 0; border-radius: 16px 4px 4px 16px; box-shadow: -16px 20px 48px rgba(0,0,0,.45); }
#pageRight { right: 0; border-radius: 4px 16px 16px 4px; box-shadow: 16px 20px 48px rgba(0,0,0,.45); }
[data-theme="light"] #pageLeft  { box-shadow: -16px 20px 48px rgba(40,60,100,.22); }
[data-theme="light"] #pageRight { box-shadow: 16px 20px 48px rgba(40,60,100,.22); }

#pageLeft::after, #pageRight::after,
.turn-front::after, .turn-back::after {
  content: ""; position: absolute; top: 0; bottom: 0; width: 44px; pointer-events: none;
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
}
#pageLeft::after { right: 0; background: linear-gradient(90deg, transparent, rgba(0,0,0,.15)); }
#pageRight::after { left: 0; background: linear-gradient(-90deg, transparent, rgba(0,0,0,.15)); }

.book-turn:not(.back) .turn-front::after { left: 0; background: linear-gradient(-90deg, transparent, rgba(0,0,0,.15)); }
.book-turn:not(.back) .turn-back::after  { right: 0; background: linear-gradient(90deg, transparent, rgba(0,0,0,.15)); }
.book-turn.back .turn-front::after      { right: 0; background: linear-gradient(90deg, transparent, rgba(0,0,0,.15)); }
.book-turn.back .turn-back::after       { left: 0; background: linear-gradient(-90deg, transparent, rgba(0,0,0,.15)); }

.book-page.page-blank,
.turn-face.page-blank {
  background: transparent !important;
  border-color: transparent !important;
  box-shadow: none !important;
  pointer-events: none !important;
}
.book-page.page-blank::after,
.turn-face.page-blank::after {
  display: none !important;
}
.page-inner {
  position: absolute; inset: 0; overflow: hidden;
  font-size: 16px; line-height: 1.7;
}
.page-inner.scroll { overflow-y: auto; }
.page-inner.no-scroll { overflow: hidden; }
.page-pad { padding: 38px 44px; min-height: 100%; }

/* 翻页片外层隔离（专享 3D 透视，避免底板阴影发生 2D/3D 重绘抖动） */
.book-turn-wrap {
  position: absolute; inset: 0; pointer-events: none; z-index: 30;
  perspective: 2600px;
}
.book-turn {
  position: absolute; top: 0; right: 0; width: 50%; height: 100%;
  transform-origin: left center; transform-style: preserve-3d;
  transition: transform .85s cubic-bezier(.25,.7,.3,1); pointer-events: none; display: none;
}
.book-turn.turning { transform: rotateY(-180deg); }
.book-turn.back { left: 0; right: auto; transform-origin: right center; }
.book-turn.back.turning { transform: rotateY(180deg); }
.turn-face {
  position: absolute; inset: 0; background: var(--paper); overflow: hidden;
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
  border: 1px solid var(--border);
}
.turn-front { border-radius: 4px 16px 16px 4px; }
.turn-back  { border-radius: 16px 4px 4px 16px; transform: rotateY(180deg); }
.book-turn.back .turn-front { border-radius: 16px 4px 4px 16px; }
.book-turn.back .turn-back  { border-radius: 4px 16px 16px 4px; }

.book-nav {
  position: absolute; top: 50%; transform: translateY(-50%); z-index: 40;
  width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center;
  background: var(--card); border: 1px solid var(--border); color: var(--text);
  font-size: 22px; box-shadow: var(--shadow-sm); transition: .2s; opacity: .75;
}
.book-nav:hover { opacity: 1; border-color: var(--accent); color: var(--accent); }
.book-nav-left  { left: 8px; }
.book-nav-right { right: 8px; }
.book-page-no {
  position: absolute; bottom: -32px; left: 50%; transform: translateX(-50%);
  color: var(--faint); font-size: 12px; font-family: var(--mono);
}
.book-hint { position: absolute; top: -34px; right: 0; color: var(--faint); font-size: 12px; }

/* ============================ 左右双侧技术书签系统 (Left & Right Side Tabs) ============================ */
.book-side-col {
  position: absolute;
  top: 10px;
  bottom: 10px;
  width: 98px;
  display: flex;
  flex-direction: column;
  gap: 3.5px;
  overflow-y: auto;
  overflow-x: visible;
  z-index: 45;
  scrollbar-width: none;
}
.book-side-col::-webkit-scrollbar { display: none; }
.book-side-left {
  left: -100px;
  align-items: flex-end;
}
.book-side-right {
  right: -100px;
  align-items: flex-start;
}
.edge-tab {
  position: relative;
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: flex-start;
  gap: 5px;
  width: 94px;
  height: 24px;
  padding: 0 6px;
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--text);
  font-size: 11px;
  cursor: pointer;
  transition: all .15s ease;
  user-select: none;
  box-shadow: 0 2px 6px rgba(0,0,0,.18);
  flex-shrink: 0;
  box-sizing: border-box;
}
.book-side-left .edge-tab {
  border-radius: 6px 0 0 6px;
  border-right: none;
  border-left: 4px solid var(--tab-color, var(--accent));
}
.book-side-left .edge-tab:hover {
  width: 100px;
  background: var(--panel2);
  box-shadow: -3px 3px 12px rgba(0,0,0,.35);
}
.book-side-right .edge-tab {
  border-radius: 0 6px 6px 0;
  border-left: none;
  border-right: 4px solid var(--tab-color, var(--accent));
}
.book-side-right .edge-tab:hover {
  width: 100px;
  background: var(--panel2);
  box-shadow: 3px 3px 12px rgba(0,0,0,.35);
}
.edge-tab .et-no {
  font-family: var(--mono);
  font-size: 11px;
  line-height: 1;
  font-weight: 800;
  flex-shrink: 0;
}
.edge-tab .et-name {
  font-size: 11px;
  font-family: var(--font);
  line-height: 1;
  color: var(--text);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex: 1;
}
.edge-tab:hover .et-name {
  color: var(--tab-color, var(--accent));
}

/* 页面跳转闪烁提示 (Page Flash Animation) */
@keyframes pageFlashAnim {
  0% { box-shadow: inset 0 0 0 3px var(--accent), 0 0 24px rgba(79,140,255,.6); }
  70% { box-shadow: inset 0 0 0 2px var(--accent), 0 0 12px rgba(79,140,255,.3); }
  100% { box-shadow: var(--shadow); }
}
.page-flash {
  animation: pageFlashAnim 1.2s cubic-bezier(.25,.7,.3,1);
}

/* 悬浮提示框 (Tooltip) */
.edge-tab-tip {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background: var(--panel);
  border: 1px solid var(--border2);
  color: var(--text);
  padding: 5px 11px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
  box-shadow: var(--shadow);
  pointer-events: none;
  opacity: 0;
  visibility: hidden;
  transition: opacity .15s, visibility .15s;
  z-index: 100;
}
.book-side-left .edge-tab .edge-tab-tip {
  right: 100%;
  margin-right: 8px;
}
.book-side-right .edge-tab .edge-tab-tip {
  left: 100%;
  margin-left: 8px;
}
.edge-tab:hover .edge-tab-tip {
  opacity: 1;
  visibility: visible;
}
@media (max-width: 1180px) {
  .book-side-col { display: none; }
}

/* ============================ 页面内容排版 ============================ */
.page-title { font-size: 26px; font-weight: 800; letter-spacing: 1px; margin-bottom: 6px; }
.page-subtitle { font-size: 13px; color: var(--dim); margin-bottom: 20px; }
.h-rule { height: 3px; width: 56px; border-radius: 3px; background: linear-gradient(90deg, var(--accent), var(--accent2)); margin-bottom: 18px; }
.pg-section { margin-bottom: 18px; }
.pg-h { font-size: 16px; font-weight: 700; color: var(--accent); margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
.pg-h::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--accent2); }
.pg-p { color: var(--text); margin-bottom: 8px; }
.pg-p.dim { color: var(--dim); }
.pg-list { list-style: none; }
.pg-list li { position: relative; padding-left: 18px; margin-bottom: 7px; color: var(--text); }
.pg-list li::before { content: "▸"; position: absolute; left: 0; color: var(--accent2); }
.badge { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 12px; border: 1px solid var(--border2); color: var(--dim); }
.badge.high { color: var(--bad); border-color: var(--bad); }
.badge.mid  { color: var(--warn); border-color: var(--warn); }
.badge.low  { color: var(--good); border-color: var(--good); }
.badge.acc  { color: var(--accent2); border-color: var(--accent2); }
.stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 18px 0; }
.stat { background: var(--panel2); border: 1px solid var(--border); border-radius: 12px; padding: 14px; text-align: center; }
.stat .num { font-size: 26px; font-weight: 800; color: var(--accent2); font-family: var(--mono); }
.stat .lbl { font-size: 12px; color: var(--dim); margin-top: 4px; }

.timeline { position: relative; padding-left: 22px; }
.timeline::before { content: ""; position: absolute; left: 6px; top: 4px; bottom: 4px; width: 2px; background: var(--border2); }
.tl-item { position: relative; margin-bottom: 16px; }
.tl-item::before { content: ""; position: absolute; left: -22px; top: 5px; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px var(--panel); }
.tl-time { font-size: 12px; color: var(--accent2); font-family: var(--mono); }
.tl-title { font-weight: 700; margin: 2px 0 4px; }
.tl-items { color: var(--dim); font-size: 13px; }

.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th, .tbl td { padding: 8px 10px; border: 1px solid var(--border); text-align: left; }
.tbl th { background: var(--panel2); color: var(--dim); font-weight: 600; white-space: nowrap; }
.tbl td { color: var(--text); }
.tbl tr:nth-child(even) td { background: var(--panel2); }
.score-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }

.cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.card { background: var(--panel2); border: 1px solid var(--border); border-radius: 12px; padding: 14px; }
.card .c-title { font-weight: 700; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
.card .c-comment { font-size: 12.5px; color: var(--dim); }

.bar { height: 8px; border-radius: 6px; background: var(--border); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 6px; background: linear-gradient(90deg, var(--accent), var(--accent2)); }

/* ============================ 网页视图（左侧目录 + 右侧内容） ============================ */
.web-layout { position: absolute; inset: 0; display: flex; }
.web-toc {
  width: 300px; flex: none; overflow-y: auto; border-right: 1px solid var(--border);
  background: var(--panel); padding: 14px 0 30px;
}
.web-toc h3 { padding: 6px 20px 12px; font-size: 13px; color: var(--dim); letter-spacing: 1px; }
.web-toc-item {
  display: flex; align-items: center; gap: 8px; padding: 8px 20px; cursor: pointer;
  color: var(--text); font-size: 13px; border-left: 3px solid transparent; transition: .15s;
}
.web-toc-item:hover { background: var(--panel2); color: var(--accent); }
.web-toc-item.active { background: var(--panel2); color: var(--accent); border-left-color: var(--accent); font-weight: 700; }
.web-toc-item .wt-no { font-family: var(--mono); color: var(--accent2); font-size: 12px; width: 34px; flex: none; }
.web-toc-item.part { font-weight: 800; color: var(--accent); margin-top: 8px; font-size: 14px; }
.web-toc-item.sub { padding-left: 36px; font-size: 12.5px; }
.web-content { flex: 1; overflow-y: auto; padding: 20px 32px 60px; }

.sec { width: 100%; max-width: 100%; margin: 14px 0 24px; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-sm); overflow: hidden; }
.sec-head { display: flex; align-items: center; gap: 12px; padding: 18px 24px; border-bottom: 1px solid var(--border); background: var(--panel2); }
.sec-no { font-family: var(--mono); color: var(--accent2); font-weight: 700; }
.sec-title { font-weight: 700; font-size: 17px; flex: 1; }
.sec-body { padding: 22px 24px; }

/* ============================ 科技树视图 ============================ */
#treeView { display: flex; flex-direction: column; }
.tree-toolbar { flex: none; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 18px; border-bottom: 1px solid var(--border); background: var(--panel); }
.tree-toolbar .tree-title { font-weight: 700; font-size: 15px; }
.tree-legend { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--dim); }
.tree-legend .lg { display: flex; align-items: center; gap: 5px; }
.tree-legend .lg .dot { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
.tree-legend .lg .line { width: 16px; height: 3px; border-radius: 2px; display: inline-block; }
.tree-stage { flex: 1; position: relative; overflow: hidden; background: var(--bg2); cursor: grab; }
.tree-stage.dragging { cursor: grabbing; }
.tree-stage svg { width: 100%; height: 100%; display: block; }
.tree-tip { color: var(--faint); font-size: 12px; }
.tree-node { cursor: pointer; }
.tree-node rect { transition: .15s; }
.tree-node:hover rect { stroke-width: 2.5; }

/* ============================ 面板 / 覆盖层 ============================ */
.overlay {
  position: fixed; inset: 0; z-index: 200; background: rgba(5,10,20,.66);
  backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; padding: 12px;
}
.panel {
  width: 98vw; height: 96vh; max-width: 2000px; background: var(--panel);
  border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow);
  display: flex; flex-direction: column; overflow: hidden;
}
.panel-head { display: flex; align-items: center; padding: 12px 18px; border-bottom: 1px solid var(--border); gap: 10px; flex: none; }
.panel-title { font-weight: 700; font-size: 16px; flex: 1; }
.panel-close { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 15px; }
.panel-close:hover { border-color: var(--bad); color: var(--bad); }
.panel-body { flex: 1; overflow: auto; padding: 20px; }
.panel-body.flex { display: flex; flex-direction: column; overflow: hidden; padding: 0; }

/* 弹窗 */
.modal { width: min(960px, 96vw); max-height: 90vh; background: var(--panel); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden; }
.modal-head { display: flex; align-items: center; padding: 14px 20px; border-bottom: 1px solid var(--border); }
.modal-head .panel-title { flex: 1; }
.modal-body { padding: 20px; overflow: auto; }

/* 灯箱 */
#lightbox { flex-direction: column; gap: 12px; }
.lightbox-toolbar { display: flex; align-items: center; gap: 12px; width: min(1200px, 94vw); color: var(--text); }
.lightbox-toolbar span { flex: 1; font-size: 14px; }
#lightboxImg { max-width: 94vw; max-height: 84vh; border-radius: 10px; background: #fff; box-shadow: var(--shadow); }

/* ============================ 长名单表格 ============================ */
.lib-toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
.lib-toolbar input, .lib-toolbar select {
  height: 34px; border-radius: 9px; border: 1px solid var(--border); background: var(--card);
  color: var(--text); padding: 0 12px; font-size: 13px; outline: none;
}
.lib-toolbar input { flex: 1; min-width: 200px; }
.lib-count { color: var(--dim); font-size: 13px; margin-left: auto; }
.lib-table-wrap { overflow: auto; border: 1px solid var(--border); border-radius: 12px; }
.lib-table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 1280px; }
.lib-table th, .lib-table td { padding: 9px 11px; border-bottom: 1px solid var(--border); text-align: left; white-space: nowrap; }
.lib-table th { background: var(--panel2); color: var(--dim); position: sticky; top: 0; cursor: pointer; user-select: none; transition: .15s; }
.lib-table th:hover { color: var(--accent); }
.lib-table th.sorted { color: var(--accent); font-weight: 700; background: var(--panel); }
.lib-table th.col-score, .lib-table td.col-score { text-align: center; padding: 9px 6px; }
.lib-table tr:hover td { background: var(--panel2); }
.lib-table td .tname { font-weight: 600; color: var(--text); }
.tag { display: inline-block; padding: 2px 9px; border-radius: 6px; font-size: 12px; border: 1px solid var(--border2); color: var(--dim); }
.pill { display: inline-block; min-width: 20px; text-align: center; padding: 1px 8px; border-radius: 20px; font-size: 12px; font-weight: 600; }
.pill.s5 { background: rgba(52,211,153,.18); color: var(--good); }
.pill.s4 { background: rgba(34,211,238,.18); color: var(--accent2); }
.pill.s3 { background: rgba(251,191,36,.18); color: var(--warn); }
.pill.s2 { background: rgba(251,146,60,.18); color: #fb923c; }
.pill.s1 { background: rgba(251,113,133,.18); color: var(--bad); }
.sixdim { display: grid; grid-template-columns: repeat(3, auto); gap: 3px 6px; }
.sixdim .sd { font-size: 10.5px; padding: 1px 5px; border-radius: 4px; white-space: nowrap; font-weight: 600; }
.sixdim .sd.s5 { background: rgba(52,211,153,.18); color: var(--good); }
.sixdim .sd.s4 { background: rgba(34,211,238,.18); color: var(--accent2); }
.sixdim .sd.s3 { background: rgba(251,191,36,.18); color: var(--warn); }
.sixdim .sd.s2 { background: rgba(251,146,60,.18); color: #fb923c; }
.sixdim .sd.s1 { background: rgba(251,113,133,.18); color: var(--bad); }
.pill-tier { border-radius: 6px; padding: 2px 8px; font-size: 12px; font-weight: 700; }
.pager { display: flex; gap: 8px; align-items: center; justify-content: center; margin-top: 14px; color: var(--dim); font-size: 13px; }
.pager button { border: 1px solid var(--border); background: var(--card); color: var(--text); border-radius: 8px; padding: 5px 12px; }
.pager button:disabled { opacity: .4; cursor: default; }
.row-detail { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 22px; }
.row-detail .rd { padding: 8px 0; border-bottom: 1px dashed var(--border); }
.row-detail .rd .k { color: var(--dim); font-size: 12px; }
.row-detail .rd .v { font-size: 14px; margin-top: 2px; }
.row-detail .rd.full { grid-column: 1 / -1; }

/* ============================ 图谱 ============================ */
.graph-toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--dim); }
.legend .lg { display: flex; align-items: center; gap: 5px; cursor: pointer; user-select: none; }
.legend .lg .dot { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
.legend .lg .line { width: 16px; height: 3px; border-radius: 2px; display: inline-block; }
.legend .lg.off { opacity: .3; }
#graphBox { position: relative; width: 100%; height: min(66vh, 640px); border: 1px solid var(--border); border-radius: 12px; background: var(--bg2); overflow: hidden; cursor: grab; }
#graphBox svg { width: 100%; height: 100%; display: block; }
#graphBox.dragging { cursor: grabbing; }
.graph-tip { color: var(--faint); font-size: 12px; }

/* ============================ 图表 ============================ */
.charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.chart-card { background: var(--panel2); border: 1px solid var(--border); border-radius: 12px; padding: 14px; }
.chart-card h4 { font-size: 14px; margin-bottom: 10px; color: var(--dim); }
.chart-card svg { width: 100%; height: 260px; }

/* ============================ 技术专题详情 ============================ */
.tech-detail { display: flex; flex-direction: column; flex: 1; min-height: 0; }
.tech-detail-bar { flex: none; padding: 12px 20px 10px; border-bottom: 1px solid var(--border); }
.tech-detail-bar .tech-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.tech-detail-bar .tech-head h2 { font-size: 20px; }
.tech-detail-actions { display: flex; gap: 8px; align-items: center; }
.tech-detail-sum {
  flex: none; margin: 10px 20px; padding: 8px 14px; border-left: 3px solid var(--accent);
  background: var(--panel2); border-radius: 0 10px 10px 0; color: var(--dim); font-size: 13px; line-height: 1.6;
}
.tabs { flex: none; display: flex; gap: 6px; padding: 0 20px; border-bottom: 1px solid var(--border); }
.tab { padding: 10px 18px; border: none; background: transparent; color: var(--dim); font-size: 14px; border-bottom: 2px solid transparent; }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 700; }
.tech-detail-body { flex: 1; overflow: auto; padding: 16px 20px; min-height: 0; }
.tabpane { display: none; }
.tabpane.active { display: block; }
.tabpane.fill { display: flex; flex-direction: column; height: 100%; }
.onepage-wrap { text-align: center; height: 100%; display: flex; align-items: center; justify-content: center; }
.onepage-wrap img { max-width: 100%; max-height: 100%; border: 1px solid var(--border); border-radius: 10px; cursor: zoom-in; background: #fff; }
.preview-toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; flex: none; }
.preview-toolbar a { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--accent); color: var(--accent); text-decoration: none; font-size: 12.5px; }
.preview-toolbar a:hover { background: var(--accent); color: #fff; }
.preview-stage { flex: 1; min-height: 0; border: 1px solid var(--border); border-radius: 10px; background: #fff; position: relative; overflow: hidden; }
.preview-stage iframe { width: 100%; height: 100%; border: 0; display: block; }
.preview-stage:fullscreen { background: #fff; }
.preview-stage:-webkit-full-screen { background: #fff; }
.preview-empty { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; color: var(--dim); font-size: 13px; text-align: center; padding: 20px; border: 1px dashed var(--border2); border-radius: 10px; }
.tech-sum { background: var(--panel2); border-left: 3px solid var(--accent); padding: 12px 16px; border-radius: 0 10px 10px 0; margin-bottom: 16px; color: var(--text); }

/* ============================ 书籍模式专享：纵向流式排版 (Vertical Book Layout) ============================ */
.book-tech-pad {
  padding: 24px 28px 28px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-height: 100%;
}
.bk-head {
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.bk-title-row {
  display: flex;
  align-items: center;
  gap: 8px;
}
.bk-no {
  font-family: var(--mono);
  font-weight: 800;
  font-size: 13px;
  background: var(--panel2);
  color: var(--accent);
  border: 1px solid var(--accent);
  padding: 2px 8px;
  border-radius: 6px;
}
.bk-name {
  font-size: 18px;
  font-weight: 800;
  color: var(--text);
  flex: 1;
}
.bk-btn {
  margin-left: auto;
}
.bk-tags-row {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

.bk-section {
  background: var(--panel2);
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 9px 13px;
}
.bk-sec-title {
  font-size: 12.5px;
  font-weight: 700;
  color: var(--accent);
  margin-bottom: 5px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.bk-sec-title .icon { font-size: 13px; }
.bk-sec-body {
  font-size: 12px;
  line-height: 1.58;
  color: var(--text);
}

.bk-def   { border-left: 3.5px solid var(--accent); background: linear-gradient(90deg, rgba(79,140,255,.08), var(--panel2)); }
.bk-trend { border-left: 3.5px solid #8b5cf6; }
.bk-value { border-left: 3.5px solid var(--good); }
.bk-limit { border-left: 3.5px solid var(--bad); }

.bk-middle-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  align-items: stretch;
}
.bk-radar-col {
  width: 100%;
  box-sizing: border-box;
  background: var(--panel2);
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.bk-radar-col .bk-sec-title {
  align-self: flex-start;
  margin-bottom: 2px;
}
.bk-radar-box {
  width: 100%;
  height: 235px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.bk-radar-box svg {
  width: 100%;
  height: 100%;
  max-width: 320px;
}
.bk-conclusion-col {
  background: linear-gradient(180deg, var(--panel2), var(--card));
  border: 1px solid var(--border);
  border-left: 3.5px solid var(--accent2);
  border-radius: 9px;
  padding: 10px 14px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.bk-conclusion-text {
  font-size: 12px;
  line-height: 1.62;
  color: var(--text);
  text-align: justify;
}
.bk-scores-grid {
  margin-top: 8px;
}
.bk-scores-grid .sixdim {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 4px 6px;
}
.bk-scores-grid .sixdim .sd {
  font-size: 10.5px;
  padding: 2px 5px;
  text-align: center;
}

/* ============================ 网页模式专享：横向大屏仪表盘 (Horizontal Web Layout) ============================ */
.web-tech-container {
  padding: 4px 0;
}
.web-tech-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
}
.web-tech-layout {
  display: grid;
  grid-template-columns: 350px 1fr;
  gap: 14px;
  align-items: stretch;
}
.web-col-dash {
  display: flex;
  flex-direction: column;
}
.web-col-content {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.bento-card {
  background: var(--panel2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 11px 14px;
  display: flex;
  flex-direction: column;
  position: relative;
  transition: border-color .2s;
}
.bento-card:hover {
  border-color: var(--border2);
}
.bento-card-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--accent);
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.bento-card-title .icon { font-size: 13px; }
.bento-card-body {
  font-size: 12px;
  line-height: 1.6;
  color: var(--text);
  flex: 1;
}

.radar-card {
  align-items: center;
  padding: 10px 12px;
}
.radar-card .bento-card-title { align-self: flex-start; }
.radar-box { width: 100%; display: flex; justify-content: center; align-items: center; }
.radar-box svg { width: 100%; max-width: 320px; height: 220px; }
.radar-scores-mini { width: 100%; margin-top: 6px; }
.radar-scores-mini .sixdim { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px 6px; }
.radar-scores-mini .sixdim .sd { text-align: center; }

.conclusion-card {
  background: linear-gradient(180deg, var(--panel2), var(--card));
  border-left: 3px solid var(--accent2);
}
.conclusion-card .bento-card-title { color: var(--accent2); }
.conclusion-text {
  font-size: 12px;
  line-height: 1.6;
  color: var(--text);
  text-align: justify;
}

.def-card   { border-top: 2px solid var(--accent); }
.trend-card { border-top: 2px solid #8b5cf6; }
.value-card { border-top: 2px solid var(--good); }
.limit-card { border-top: 2px solid var(--bad); }

.pill-disposal { font-size: 11.5px; padding: 2px 8px; border-radius: 6px; background: rgba(79,140,255,.14); color: var(--accent); border: 1px solid rgba(79,140,255,.35); font-weight: 600; }
.pill-dim { font-size: 11.5px; padding: 2px 8px; border-radius: 6px; background: var(--panel2); color: var(--dim); border: 1px solid var(--border); }
.pill-attr { font-size: 11.5px; padding: 2px 8px; border-radius: 6px; background: var(--panel2); color: var(--accent2); border: 1px solid var(--border); }
.btn-sm { height: 28px; padding: 0 10px; font-size: 12px; }

.tech-box-list {
  list-style: none;
  margin: 0;
  padding: 0;
}
.tech-box-list li {
  position: relative;
  padding-left: 13px;
  margin-bottom: 3px;
  font-size: 11.5px;
  line-height: 1.48;
  color: var(--text);
}
.tech-box-list li:last-child { margin-bottom: 0; }
.tech-box-list li::before {
  content: "▸";
  position: absolute;
  left: 0;
  top: 0;
  color: var(--accent);
  font-size: 11px;
}
.tech-box-list li .hl {
  color: var(--accent2);
  font-weight: 700;
  margin-right: 2px;
}
.tech-box-text {
  font-size: 11.5px;
  line-height: 1.5;
  color: var(--text);
}

/* ============================ 封面 / 篇章页 ============================ */
.cover-full {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
  justify-content: center; text-align: center; padding: 40px; overflow: hidden;
  background: radial-gradient(130% 100% at 50% 0%, #1d2d52 0%, #0e172b 52%, #090f1c 100%);
  color: #eaf1ff;
}
.cover-full .cov-kicker { letter-spacing: 7px; color: #4f8cff; font-size: 13px; margin-bottom: 20px; text-transform: uppercase; }
.cover-full .cov-title { font-size: clamp(26px, 3.4vw, 42px); font-weight: 800; letter-spacing: 5px; line-height: 1.35; }
.cover-full .cov-sub { margin-top: 16px; color: #b9c9e8; font-size: 15px; letter-spacing: 2px; }
.cover-full .cov-rule { width: 120px; height: 3px; border-radius: 3px; margin: 26px 0; background: linear-gradient(90deg, #4f8cff, #22d3ee); }
.cover-full .cov-meta { color: #8fa3c0; font-size: 13px; letter-spacing: 1px; line-height: 2.1; }
.cover-orb { position: absolute; border-radius: 50%; filter: blur(3px); opacity: .45; pointer-events: none; }
.divider-full {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
  justify-content: center; text-align: center; padding: 40px; overflow: hidden;
  background: linear-gradient(160deg, var(--paper2), var(--paper));
}
.divider-full .dv-part { font-family: var(--mono); color: var(--accent2); letter-spacing: 5px; font-size: 14px; }
.divider-full .dv-title { font-size: clamp(26px, 3vw, 36px); font-weight: 800; letter-spacing: 8px; margin: 16px 0; color: var(--text); }
.divider-full .dv-desc { color: var(--dim); max-width: 440px; line-height: 1.9; font-size: 14px; }
.divider-full .dv-num { font-family: var(--mono); font-size: 150px; font-weight: 800; opacity: .07; position: absolute; right: 18px; bottom: -14px; line-height: 1; color: var(--text); }
.toc-list { list-style: none; }
.toc-list li { display: flex; align-items: baseline; gap: 10px; padding: 7px 4px; border-bottom: 1px dashed var(--border); cursor: pointer; }
.toc-list li:hover { color: var(--accent); }
.toc-list .toc-no { font-family: var(--mono); color: var(--accent2); font-size: 13px; width: 40px; flex: none; }
.toc-list .toc-label { font-weight: 600; font-size: 13.5px; }
.toc-list .toc-part { font-weight: 800; color: var(--accent); font-size: 15px; }
.toc-list .toc-indent { padding-left: 18px; }

/* ============================ Toast ============================ */
.toast { position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--border2); color: var(--text); padding: 10px 20px; border-radius: 20px; box-shadow: var(--shadow-sm); z-index: 400; font-size: 13px; }

/* ============================ 响应式 ============================ */
@media (max-width: 1100px) {
  .web-tech-layout { grid-template-columns: 1fr; }
  .web-col-content { grid-template-columns: 1fr; }
}
@media (max-width: 900px) {
  .book { width: 96vw; height: calc(100vh - var(--topbar-h) - 40px); }
  .book-page { width: 100%; border-radius: 14px; }
  #pageLeft { display: none; }
  #pageRight { left: 0; right: 0; }
  .book-nav-left { left: 4px; }
  .book-nav-right { right: 4px; }
  .cards, .charts-grid, .row-detail { grid-template-columns: 1fr; }
  .brand-sub { display: none; }
  .search-wrap { max-width: 180px; }
  .web-toc { width: 220px; }
  .tech-page-pad { padding: 16px; }
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand" id="brandBtn" title="回到封面">
    <div class="brand-icon">研</div>
    <div class="brand-text">
      <div class="brand-title">银行金融科技前沿技术研究成果</div>
      <div class="brand-sub">电子研究书 · 书籍 / 网页 / 科技树</div>
    </div>
  </div>
  <div class="search-wrap">
    <input id="searchInput" type="text" placeholder="搜索技术名称 / 关键词，回车跳转…" autocomplete="off">
    <div id="searchResults" class="search-results hidden"></div>
  </div>
  <div class="topbar-actions">
    <button class="btn mode-btn active" id="btnBook" title="书籍模式">📖 书籍</button>
    <button class="btn mode-btn" id="btnWeb" title="网页模式">🌐 网页</button>
    <button class="btn mode-btn" id="btnTree" title="科技树">🌳 科技树</button>
    <button class="btn" id="btnTheme" title="切换明暗主题">🌓 主题</button>
  </div>
</header>

<main id="bookView" class="view">
  <div class="book-stage">
    <div class="book" id="book">
      <div class="book-side-col book-side-left" id="bookSideLeft"></div>
      <div class="book-side-col book-side-right" id="bookSideRight"></div>
      <div class="book-page" id="pageLeft"><div class="page-inner" id="pageLeftInner"></div></div>
      <div class="book-page" id="pageRight"><div class="page-inner" id="pageRightInner"></div></div>
      <div class="book-turn-wrap" id="turnWrap">
        <div class="book-turn" id="turnSheet">
          <div class="turn-face turn-front"><div class="page-inner" id="turnFrontInner"></div></div>
          <div class="turn-face turn-back"><div class="page-inner" id="turnBackInner"></div></div>
        </div>
      </div>
      <div class="book-nav book-nav-left" id="navPrev">‹</div>
      <div class="book-nav book-nav-right" id="navNext">›</div>
      <div class="book-page-no" id="pageNo">封面</div>
    </div>
  </div>
</main>

<main id="webView" class="view hidden">
  <div class="web-layout">
    <aside class="web-toc" id="webToc"></aside>
    <div class="web-content" id="webContent"></div>
  </div>
</main>

<main id="treeView" class="view hidden">
  <div class="tree-toolbar" id="treeToolbar"></div>
  <div class="tree-stage" id="treeStage"></div>
</main>

<div class="overlay hidden" id="panel">
  <div class="panel">
    <div class="panel-head">
      <div class="panel-title" id="panelTitle"></div>
      <button class="panel-close" id="panelClose" title="关闭">✕</button>
    </div>
    <div class="panel-body" id="panelBody"></div>
  </div>
</div>

<div class="overlay hidden" id="lightbox">
  <div class="lightbox-toolbar">
    <span id="lightboxTitle"></span>
    <button class="panel-close" id="lightboxClose" title="关闭">✕</button>
  </div>
  <img id="lightboxImg" alt="预览图">
</div>

<div class="overlay hidden" id="modal">
  <div class="modal">
    <div class="modal-head"><div class="panel-title" id="modalTitle"></div><button class="panel-close" id="modalClose">✕</button></div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<div class="toast hidden" id="toast"></div>

<script src="data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
