<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>科技发展部前沿技术研究成果集 · 电子研究书</title>
<style>
/* ============================ 基础与主题变量 ============================ */
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --radius: 14px;
  --font: "Segoe UI", "Microsoft YaHei", "PingFang SC", "Source Han Sans SC", system-ui, sans-serif;
  --mono: "Cascadia Code", "Consolas", "Courier New", monospace;
  --topbar-h: 58px;
}
[data-theme="dark"] {
  --bg: #0b111e; --bg2: #0e1524;
  --panel: #141f33; --panel2: #1a2740; --card: #172136;
  --border: #263651; --border2: #33486b;
  --text: #dbe6f5; --dim: #8fa3c0; --faint: #64789a;
  --accent: #4f8cff; --accent2: #22d3ee;
  --good: #34d399; --warn: #fbbf24; --bad: #fb7185;
  --paper: #16223a; --paper2: #1b2944;
  --shadow: 0 20px 60px rgba(0,0,0,.55);
  --shadow-sm: 0 6px 20px rgba(0,0,0,.35);
  --glow: 0 0 24px rgba(79,140,255,.25);
}
[data-theme="light"] {
  --bg: #e8edf5; --bg2: #dfe6f0;
  --panel: #ffffff; --panel2: #f4f7fb; --card: #ffffff;
  --border: #dbe2ee; --border2: #c2cde0;
  --text: #1b2537; --dim: #54637f; --faint: #8a99b4;
  --accent: #2f6bff; --accent2: #0ea5c4;
  --good: #059669; --warn: #d97706; --bad: #e11d48;
  --paper: #fdfefe; --paper2: #f4f6fa;
  --shadow: 0 20px 60px rgba(40,60,100,.28);
  --shadow-sm: 0 6px 20px rgba(40,60,100,.16);
  --glow: 0 0 24px rgba(47,107,255,.18);
}
html, body { height: 100%; }
body {
  font-family: var(--font);
  background: radial-gradient(1200px 700px at 50% 10%, var(--bg2), var(--bg));
  color: var(--text);
  overflow: hidden;
  transition: background .4s, color .4s;
}
button { font-family: var(--font); cursor: pointer; }
.hidden { display: none !important; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 8px; }
::-webkit-scrollbar-track { background: transparent; }

/* ============================ 顶栏 ============================ */
.topbar {
  height: var(--topbar-h); display: flex; align-items: center; gap: 14px;
  padding: 0 18px; border-bottom: 1px solid var(--border);
  background: var(--panel);
  position: relative; z-index: 50;
}
.brand { display: flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; }
.brand-icon {
  width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: #fff; font-weight: 700; font-size: 17px; box-shadow: var(--glow);
}
.brand-title { font-weight: 700; font-size: 15px; letter-spacing: .5px; }
.brand-sub { font-size: 11px; color: var(--dim); }
.search-wrap { flex: 1; max-width: 460px; position: relative; }
.search-wrap input {
  width: 100%; height: 38px; border-radius: 20px; border: 1px solid var(--border);
  background: var(--card); color: var(--text); padding: 0 16px; font-size: 13px; outline: none;
}
.search-wrap input:focus { border-color: var(--accent); box-shadow: var(--glow); }
.search-results {
  position: absolute; top: 44px; left: 0; right: 0; background: var(--panel);
  border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow-sm);
  max-height: 340px; overflow: auto; z-index: 100;
}
.search-item { padding: 10px 14px; cursor: pointer; display: flex; gap: 10px; align-items: center; }
.search-item:hover { background: var(--panel2); }
.search-item .si-name { font-weight: 600; font-size: 13px; }
.search-item .si-cat { font-size: 11px; color: var(--accent2); }
.search-item .si-sum { font-size: 12px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.topbar-actions { display: flex; gap: 8px; margin-left: auto; }
.btn {
  height: 36px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--card); color: var(--text); font-size: 13px; transition: .2s;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.active { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: var(--glow); }
.mode-btn { min-width: 52px; }

/* ============================ 视图容器 ============================ */
.view { position: absolute; top: var(--topbar-h); left: 0; right: 0; bottom: 0; }

/* ============================ 书 ============================ */
.book-stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
.book {
  position: relative; width: min(1500px, 80vw); height: calc(100vh - var(--topbar-h) - 76px);
}
[data-theme="dark"] .book::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 16px;
  pointer-events: none;
  z-index: 0;
  background: transparent;
  box-shadow:
    /* 1. 底部地坪主辉光 (多层平滑高斯衰减) */
    0 16px 28px -4px rgba(56, 189, 248, 0.45),
    0 32px 55px -8px rgba(56, 189, 248, 0.35),
    0 55px 90px -14px rgba(79, 140, 255, 0.28),
    0 80px 135px -20px rgba(56, 189, 248, 0.18),
    0 110px 180px -28px rgba(79, 140, 255, 0.10),
    /* 2. 右侧立体轮廓辉光 */
    24px 10px 42px -6px rgba(56, 189, 248, 0.38),
    48px 18px 75px -12px rgba(79, 140, 255, 0.24),
    72px 26px 115px -18px rgba(56, 189, 248, 0.14),
    /* 3. 左侧自然平衡微光 */
    -16px 10px 38px -6px rgba(56, 189, 248, 0.22),
    -32px 18px 65px -12px rgba(79, 140, 255, 0.12);
  contain: strict;
}

[data-theme="light"] .book::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 16px;
  pointer-events: none;
  z-index: 0;
  background: transparent;
  box-shadow:
    /* 1. 亮色模式：深邃地坪漫反射阴影 */
    0 16px 30px -5px rgba(30, 50, 90, 0.28),
    0 35px 60px -10px rgba(30, 50, 90, 0.22),
    0 60px 95px -15px rgba(79, 140, 255, 0.16),
    0 90px 145px -22px rgba(30, 50, 90, 0.12),
    0 120px 190px -30px rgba(79, 140, 255, 0.07),
    /* 2. 右侧立体雕塑阴影 */
    26px 12px 48px -8px rgba(30, 50, 90, 0.24),
    52px 20px 85px -14px rgba(79, 140, 255, 0.15),
    78px 28px 125px -20px rgba(30, 50, 90, 0.09),
    /* 3. 左侧平衡微光 */
    -18px 12px 42px -8px rgba(30, 50, 90, 0.15),
    -36px 20px 70px -14px rgba(79, 140, 255, 0.08);
  contain: strict;
}

.book-page {
  position: absolute; top: 0; height: 100%; width: 50%;
  background: var(--paper); overflow: hidden;
  border: 1px solid var(--border);
  z-index: 10;
  contain: content;
  transform: translateZ(0);
}
#pageLeft  { left: 0; border-radius: 16px 4px 4px 16px; box-shadow: -18px 22px 55px rgba(0,0,0,.45); }
#pageRight { right: 0; border-radius: 4px 16px 16px 4px; box-shadow: 24px 28px 65px rgba(0,0,0,.5); }

/* 亮色主题深邃立体阴影体系 */
[data-theme="light"] #pageLeft:not(.page-blank) {
  box-shadow:
    0 3px 10px rgba(30, 50, 90, 0.14),
    -14px 18px 42px rgba(30, 50, 90, 0.26),
    -24px 30px 65px rgba(30, 50, 90, 0.32),
    0 18px 50px rgba(79, 140, 255, 0.2) !important;
}
[data-theme="light"] #pageRight:not(.page-blank) {
  box-shadow:
    0 3px 10px rgba(30, 50, 90, 0.14),
    14px 18px 42px rgba(30, 50, 90, 0.26),
    24px 30px 65px rgba(30, 50, 90, 0.32),
    0 18px 50px rgba(79, 140, 255, 0.2) !important;
}

/* 暗色主题适度优雅光影体系 */
[data-theme="dark"] #pageLeft:not(.page-blank) {
  box-shadow:
    0 2px 6px rgba(0, 0, 0, 0.35),
    -10px 12px 24px rgba(0, 0, 0, 0.4),
    -12px 14px 32px rgba(56, 189, 248, 0.38),
    0 18px 45px rgba(79, 140, 255, 0.25),
    0 10px 25px rgba(56, 189, 248, 0.32) !important;
  border-color: rgba(56, 189, 248, 0.38) !important;
}
[data-theme="dark"] #pageRight:not(.page-blank) {
  box-shadow:
    0 2px 6px rgba(0, 0, 0, 0.35),
    10px 12px 24px rgba(0, 0, 0, 0.4),
    12px 14px 32px rgba(56, 189, 248, 0.38),
    0 18px 45px rgba(79, 140, 255, 0.25),
    0 10px 25px rgba(56, 189, 248, 0.32) !important;
  border-color: rgba(56, 189, 248, 0.38) !important;
}

/* 暗色封面与封底环境光 (全面对齐打开时的复合辉光密度与书边外扩) */
[data-theme="dark"] .book.is-cover::before {
  left: calc(50% - 20px) !important;
  right: -24px !important;
  top: 0 !important;
  bottom: 0 !important;
  inset: auto !important;
  border-radius: 4px 16px 16px 4px !important;
  background: transparent !important;
  box-shadow:
    /* 核心近场强烈漫反射 (对齐双页叠加亮度) */
    0 8px 16px rgba(56, 189, 248, 0.85),
    0 18px 30px rgba(56, 189, 248, 0.72),
    0 32px 55px rgba(56, 189, 248, 0.60),
    0 55px 90px rgba(79, 140, 255, 0.50),
    0 85px 140px rgba(56, 189, 248, 0.35),
    0 120px 190px rgba(79, 140, 255, 0.22),
    /* 右侧强烈立体轮廓与书厚辉光 */
    14px 6px 22px rgba(56, 189, 248, 0.90),
    28px 12px 42px rgba(56, 189, 248, 0.75),
    52px 18px 75px rgba(79, 140, 255, 0.55),
    80px 26px 120px rgba(56, 189, 248, 0.32) !important;
}
[data-theme="dark"] .book.is-back-cover::before {
  right: calc(50% - 20px) !important;
  left: -24px !important;
  top: 0 !important;
  bottom: 0 !important;
  inset: auto !important;
  border-radius: 16px 4px 4px 16px !important;
  background: transparent !important;
  box-shadow:
    /* 核心近场强烈漫反射 */
    0 8px 16px rgba(56, 189, 248, 0.85),
    0 18px 30px rgba(56, 189, 248, 0.72),
    0 32px 55px rgba(56, 189, 248, 0.60),
    0 55px 90px rgba(79, 140, 255, 0.50),
    0 85px 140px rgba(56, 189, 248, 0.35),
    0 120px 190px rgba(79, 140, 255, 0.22),
    /* 左侧强烈立体轮廓与书厚辉光 */
    -14px 6px 22px rgba(56, 189, 248, 0.90),
    -28px 12px 42px rgba(56, 189, 248, 0.75),
    -52px 18px 75px rgba(79, 140, 255, 0.55),
    -80px 26px 120px rgba(56, 189, 248, 0.32) !important;
}

[data-theme="dark"] .book.is-cover #pageRight {
  box-shadow:
    0 3px 8px rgba(0, 0, 0, 0.4),
    12px 14px 28px rgba(0, 0, 0, 0.5),
    16px 18px 38px rgba(56, 189, 248, 0.68),
    0 20px 48px rgba(79, 140, 255, 0.50),
    0 12px 28px rgba(56, 189, 248, 0.55) !important;
  border-color: rgba(56, 189, 248, 0.75) !important;
}
[data-theme="dark"] .book.is-back-cover #pageLeft {
  box-shadow:
    0 3px 8px rgba(0, 0, 0, 0.4),
    -12px 14px 28px rgba(0, 0, 0, 0.5),
    -16px 18px 38px rgba(56, 189, 248, 0.68),
    0 20px 48px rgba(79, 140, 255, 0.50),
    0 12px 28px rgba(56, 189, 248, 0.55) !important;
  border-color: rgba(56, 189, 248, 0.75) !important;
}

/* 亮色封面与封底环境光 */
[data-theme="light"] .book.is-cover::before {
  left: 50% !important;
  right: -24px !important;
  top: 0 !important;
  bottom: 0 !important;
  inset: auto !important;
  border-radius: 4px 16px 16px 4px !important;
  background: transparent !important;
  box-shadow:
    0 14px 28px rgba(30, 50, 90, 0.42),
    0 30px 55px rgba(30, 50, 90, 0.35),
    0 55px 90px rgba(79, 140, 255, 0.28),
    0 85px 140px rgba(30, 50, 90, 0.20),
    0 120px 190px rgba(79, 140, 255, 0.12),
    14px 8px 24px rgba(30, 50, 90, 0.38),
    28px 14px 50px rgba(30, 50, 90, 0.32),
    55px 22px 90px rgba(79, 140, 255, 0.22),
    82px 30px 130px rgba(30, 50, 90, 0.14) !important;
}
[data-theme="light"] .book.is-back-cover::before {
  right: 50% !important;
  left: -24px !important;
  top: 0 !important;
  bottom: 0 !important;
  inset: auto !important;
  border-radius: 16px 4px 4px 16px !important;
  background: transparent !important;
  box-shadow:
    0 14px 28px rgba(30, 50, 90, 0.42),
    0 30px 55px rgba(30, 50, 90, 0.35),
    0 55px 90px rgba(79, 140, 255, 0.28),
    0 85px 140px rgba(30, 50, 90, 0.20),
    0 120px 190px rgba(79, 140, 255, 0.12),
    -14px 8px 24px rgba(30, 50, 90, 0.38),
    -28px 14px 50px rgba(30, 50, 90, 0.32),
    -55px 22px 90px rgba(79, 140, 255, 0.22),
    -82px 30px 130px rgba(30, 50, 90, 0.14) !important;
}

[data-theme="light"] .book.is-cover #pageRight {
  box-shadow:
    0 4px 12px rgba(30, 50, 90, 0.20),
    18px 22px 52px rgba(30, 50, 90, 0.38),
    32px 38px 82px rgba(30, 50, 90, 0.42),
    0 22px 60px rgba(79, 140, 255, 0.28) !important;
}
[data-theme="light"] .book.is-back-cover #pageLeft {
  box-shadow:
    0 4px 12px rgba(30, 50, 90, 0.20),
    -18px 22px 52px rgba(30, 50, 90, 0.38),
    -32px 38px 82px rgba(30, 50, 90, 0.42),
    0 22px 60px rgba(79, 140, 255, 0.28) !important;
}

#pageLeft::after, #pageRight::after,
.turn-front::after, .turn-back::after {
  content: ""; position: absolute; top: 0; bottom: 0; width: 44px; pointer-events: none;
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
}
#pageLeft::after  { right: 0; background: linear-gradient(90deg, transparent, rgba(0,0,0,.15)); }
#pageRight::after { left: 0; background: linear-gradient(-90deg, transparent, rgba(0,0,0,.15)); }

.book-turn:not(.back) .turn-front::after { left: 0; background: linear-gradient(-90deg, transparent, rgba(0,0,0,.15)); }
.book-turn:not(.back) .turn-back::after  { right: 0; background: linear-gradient(90deg, transparent, rgba(0,0,0,.15)); }
.book-turn.back .turn-front::after      { right: 0; background: linear-gradient(90deg, transparent, rgba(0,0,0,.15)); }
.book-turn.back .turn-back::after       { left: 0; background: linear-gradient(-90deg, transparent, rgba(0,0,0,.15)); }

.book-page.page-blank,
.turn-face.page-blank,
#pageLeft.page-blank,
#pageRight.page-blank {
  background: transparent !important;
  border: none !important;
  border-color: transparent !important;
  box-shadow: none !important;
  pointer-events: none !important;
  visibility: hidden !important;
  outline: none !important;
}
.book-page.page-blank::after,
.turn-face.page-blank::after,
#pageLeft.page-blank::after,
#pageRight.page-blank::after {
  display: none !important;
  opacity: 0 !important;
}
.page-inner {
  position: absolute; inset: 0; overflow: hidden;
  font-size: 16px; line-height: 1.7;
}
.page-inner.scroll { overflow-y: auto; }
.page-inner.no-scroll { overflow: hidden; }
.page-pad { padding: 38px 44px; min-height: 100%; }

/* 翻页片外层隔离（专享 3D 透视，避免底板阴影发生 2D/3D 重绘抖动） */
.book-turn-wrap {
  position: absolute; inset: 0; pointer-events: none; z-index: 30;
  perspective: 2600px;
}
.book-turn {
  position: absolute; top: 0; right: 0; width: 50%; height: 100%;
  transform-origin: left center; transform-style: preserve-3d;
  transition: transform .85s cubic-bezier(.25,.7,.3,1); pointer-events: none; display: none;
}
.book-turn.turning { transform: rotateY(-180deg); }
.book-turn.back { left: 0; right: auto; transform-origin: right center; }
.book-turn.back.turning { transform: rotateY(180deg); }
.turn-face {
  position: absolute; inset: 0; background: var(--paper); overflow: hidden;
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
  border: 1px solid var(--border);
}
.turn-front { border-radius: 4px 16px 16px 4px; }
.turn-back  { border-radius: 16px 4px 4px 16px; transform: rotateY(180deg); }
.book-turn.back .turn-front { border-radius: 16px 4px 4px 16px; }
.book-turn.back .turn-back  { border-radius: 4px 16px 16px 4px; }

/* ============================ ✨ 动效增强系统 (Phase 1 Refined) ============================ */
#fxCanvas {
  position: fixed;
  top: var(--topbar-h);
  left: 0; right: 0; bottom: 0;
  pointer-events: none;
  z-index: 0;
  opacity: 0;
  transition: opacity 0.5s ease;
}
body.fx-enabled #fxCanvas {
  opacity: 1;
}

/* 1. 真实 3D 拟真折角掀起 (Hyper-realistic 3D Page Curl - Hover Only) */
.corner-peek {
  position: absolute;
  width: 70px;
  height: 70px;
  z-index: 50;
  cursor: pointer;
  display: block;
  pointer-events: auto;
}
.corner-peek-r { right: 0; bottom: 0; }
.corner-peek-l { left: 0; bottom: 0; }

/* 默认状态：完全隐藏折叠结构 (0 像素) */
.corner-peek-r .curl-shadow {
  position: absolute; right: 0; bottom: 0; width: 0; height: 0; opacity: 0;
  background: radial-gradient(circle at 0% 0%, rgba(0,0,0,.55) 0%, rgba(0,0,0,.2) 45%, transparent 68%);
  pointer-events: none;
  transition: width .28s cubic-bezier(.2,.8,.2,1), height .28s cubic-bezier(.2,.8,.2,1), opacity .2s ease;
}
.corner-peek-r .curl-fold {
  position: absolute; right: 0; bottom: 0; width: 0; height: 0;
  border-style: solid;
  border-width: 0 0 0 0;
  border-color: transparent transparent var(--panel2) transparent;
  box-shadow: -5px -5px 9px rgba(0,0,0,.45);
  transition: border-width .28s cubic-bezier(.2,.8,.2,1), box-shadow .28s ease;
}
.corner-peek-r .curl-fold::after {
  content: ""; position: absolute; right: 0; bottom: 0; width: 0; height: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.5) 0%, rgba(79,140,255,0.3) 35%, transparent 55%);
  pointer-events: none;
  transition: width .28s cubic-bezier(.2,.8,.2,1), height .28s cubic-bezier(.2,.8,.2,1), bottom .28s cubic-bezier(.2,.8,.2,1);
}
.corner-peek-r .curl-hint {
  position: absolute; right: 8px; bottom: -64px;
  font-size: 11px; font-weight: 700; color: var(--accent);
  white-space: nowrap; opacity: 0;
  transition: opacity .2s ease;
  pointer-events: none;
}

/* 鼠标悬停时：平滑掀起 3D 折角（默认常驻原生微交互） */
.corner-peek-r:hover .curl-shadow {
  width: 78px; height: 78px; opacity: 1;
}
.corner-peek-r:hover .curl-fold {
  border-width: 0 0 78px 78px;
  border-color: transparent transparent var(--card) transparent;
  box-shadow: -8px -8px 16px rgba(0,0,0,.6);
}
.corner-peek-r:hover .curl-fold::after {
  width: 78px; height: 78px; bottom: -78px;
  background: linear-gradient(135deg, rgba(255,255,255,0.7) 0%, rgba(79,140,255,0.45) 35%, transparent 55%);
}
.corner-peek-r:hover .curl-hint {
  opacity: 1;
}

/* 左下折角（默认隐藏，悬停时出现） */
.corner-peek-l .curl-shadow {
  position: absolute; left: 0; bottom: 0; width: 0; height: 0; opacity: 0;
  background: radial-gradient(circle at 100% 0%, rgba(0,0,0,.55) 0%, rgba(0,0,0,.2) 45%, transparent 68%);
  pointer-events: none;
  transition: width .28s cubic-bezier(.2,.8,.2,1), height .28s cubic-bezier(.2,.8,.2,1), opacity .2s ease;
}
.corner-peek-l .curl-fold {
  position: absolute; left: 0; bottom: 0; width: 0; height: 0;
  border-style: solid;
  border-width: 0 0 0 0;
  border-color: transparent var(--panel2) transparent transparent;
  box-shadow: 5px -5px 9px rgba(0,0,0,.45);
  transition: border-width .28s cubic-bezier(.2,.8,.2,1), box-shadow .28s ease;
}
.corner-peek-l .curl-fold::after {
  content: ""; position: absolute; left: 0; bottom: 0; width: 0; height: 0;
  background: linear-gradient(225deg, rgba(255,255,255,0.5) 0%, rgba(79,140,255,0.3) 35%, transparent 55%);
  pointer-events: none;
  transition: width .28s cubic-bezier(.2,.8,.2,1), height .28s cubic-bezier(.2,.8,.2,1), bottom .28s cubic-bezier(.2,.8,.2,1);
}
.corner-peek-l .curl-hint {
  position: absolute; left: 8px; bottom: -64px;
  font-size: 11px; font-weight: 700; color: var(--accent);
  white-space: nowrap; opacity: 0;
  transition: opacity .2s ease;
  pointer-events: none;
}
.corner-peek-l:hover .curl-shadow {
  width: 78px; height: 78px; opacity: 1;
}
.corner-peek-l:hover .curl-fold {
  border-width: 0 78px 78px 0;
  border-color: transparent var(--card) transparent transparent;
  box-shadow: 8px -8px 16px rgba(0,0,0,.6);
}
.corner-peek-l:hover .curl-fold::after {
  width: 78px; height: 78px; bottom: -78px;
  background: linear-gradient(225deg, rgba(255,255,255,0.7) 0%, rgba(79,140,255,0.45) 35%, transparent 55%);
}
.corner-peek-l:hover .curl-hint {
  opacity: 1;
}

/* 2. 翻页铜版纸高光流光与圆柱立体阴影 (Cylindrical 3D Page Sheen & Shadow) */
.turn-sheen {
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: 0;
  z-index: 100;
  background: linear-gradient(90deg, transparent 0%, rgba(0,0,0,0.4) 25%, rgba(255,255,255,0.9) 50%, rgba(0,0,0,0.3) 75%, transparent 100%);
}
body.fx-enabled .book-turn.turning .turn-sheen {
  opacity: 1;
  mix-blend-mode: overlay;
}
body.fx-enabled .book-turn:not(.back).turning .turn-front .turn-sheen {
  animation: fxSheenSweep 0.85s cubic-bezier(.25,.7,.3,1) forwards;
}
body.fx-enabled .book-turn:not(.back).turning .turn-back .turn-sheen {
  animation: fxSheenSweepBack 0.85s cubic-bezier(.25,.7,.3,1) forwards;
}
body.fx-enabled .book-turn.back.turning .turn-front .turn-sheen {
  animation: fxSheenSweepBack 0.85s cubic-bezier(.25,.7,.3,1) forwards;
}
body.fx-enabled .book-turn.back.turning .turn-back .turn-sheen {
  animation: fxSheenSweep 0.85s cubic-bezier(.25,.7,.3,1) forwards;
}

@keyframes fxSheenSweep {
  0%   { transform: translateX(-100%) skewX(-20deg); opacity: 0; }
  25%  { opacity: 1; }
  65%  { opacity: 0.9; }
  100% { transform: translateX(160%) skewX(-20deg); opacity: 0; }
}
@keyframes fxSheenSweepBack {
  0%   { transform: translateX(160%) skewX(20deg); opacity: 0; }
  25%  { opacity: 1; }
  65%  { opacity: 0.9; }
  100% { transform: translateX(-100%) skewX(20deg); opacity: 0; }
}

/* 3. 封面与封底全息金属流光（仅在显示封面或封底时激活，阅读内页时完全关闭 0 消耗） */
.cover-full .cov-title {
  background: linear-gradient(115deg, #eaf1ff 0%, #ffffff 30%, #93c5fd 60%, #ffffff 85%, #eaf1ff 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 4px 14px rgba(79,140,255,.35));
}
body.fx-enabled .book.is-cover .cover-full .cov-title,
body.fx-enabled .book.is-back-cover .cover-full .cov-title {
  background: linear-gradient(
    115deg,
    #eaf1ff 0%,
    #ffffff 8%,
    #60a5fa 18%,
    #22d3ee 26%,
    #c084fc 36%,
    #ffffff 44%,
    #eaf1ff 50%,
    #ffffff 58%,
    #60a5fa 68%,
    #22d3ee 76%,
    #c084fc 86%,
    #ffffff 94%,
    #eaf1ff 100%
  );
  background-size: 200% 100%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: fxTitleShine 2.8s linear infinite;
  filter: drop-shadow(0 4px 14px rgba(79,140,255,.35));
}
@keyframes fxTitleShine {
  0% { background-position: 0% center; }
  100% { background-position: -200% center; }
}
body.fx-enabled .cover-full .cov-rule {
  box-shadow: 0 0 12px rgba(34,211,238,.75);
}

/* 4. 六维雷达多边形轮廓绘制与节点弹簧点亮 (Native SVG Radar Drawing) */
@keyframes fxRadarGrow {
  0% {
    stroke-dasharray: 600;
    stroke-dashoffset: 600;
    fill-opacity: 0;
  }
  65% {
    stroke-dashoffset: 0;
    fill-opacity: 0.12;
  }
  100% {
    stroke-dasharray: 600;
    stroke-dashoffset: 0;
    fill-opacity: 0.32;
  }
}
body.fx-enabled .radar-svg .radar-poly {
  animation: fxRadarGrow 0.85s cubic-bezier(0.16, 1, 0.3, 1) both;
}
@keyframes fxNodePop {
  0% {
    transform: scale(0);
    opacity: 0;
  }
  70% {
    transform: scale(1.35);
    opacity: 1;
  }
  100% {
    transform: scale(1);
    opacity: 1;
  }
}
body.fx-enabled .radar-svg .radar-node {
  transform-box: fill-box;
  transform-origin: center center;
  animation: fxNodePop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) both;
}

/* ⚡ 全书与光影采用纯静态 GPU 位图缓存（无任何呼吸动效，0 页面重绘，0 开销极度稳定） */
.book::before, #pageLeft, #pageRight, .book-edge-left, .book-edge-right {
  animation: none !important;
  transform: translateZ(0);
}

/* ⚡ 动效开与关时，整本书阴影与光晕保持 100% 相同优雅静态（仅关闭图表与流光等微交互动效） */
body.fx-disabled .radar-svg .radar-poly,
body.fx-disabled .radar-svg .radar-node,
body.fx-disabled .bar-fill-rect,
body.fx-disabled .turn-sheen,
body.fx-disabled .cov-title {
  animation: none !important;
  transition: none !important;
}

/* 5. 能量评分条平滑充能自左向右实体增长 (Smooth Left-to-Right Energy Growth) */
@keyframes fxEnergyGrow {
  0% {
    transform: scaleX(0);
    opacity: 0.6;
  }
  25% {
    opacity: 1;
  }
  65% {
    opacity: 1;
  }
  100% {
    transform: scaleX(1);
    opacity: 1;
  }
}
body.fx-enabled .bar > i {
  transform-origin: left center;
  animation: fxEnergyGrow 2.3s cubic-bezier(0.25, 0.1, 0.25, 1) both;
}

@keyframes fxSvgBarGrow {
  0% {
    transform: scaleX(0);
    opacity: 0.4;
  }
  100% {
    transform: scaleX(1);
    opacity: 1;
  }
}
body.fx-enabled .bar-svg-chart .bar-fill-rect {
  transform-box: fill-box;
  transform-origin: left center;
  animation: fxSvgBarGrow 2.2s cubic-bezier(0.25, 0.1, 0.25, 1) both;
}

.book-page.page-blank .corner-peek,
.book-page.page-blank .corner-peek-r,
.book-page.page-blank .corner-peek-l {
  display: none !important;
  pointer-events: none !important;
  visibility: hidden !important;
}

/* 6. 动态物理多层阶梯书边厚度层叠 (Dynamic 3D Multi-Layer Book Thickness) */
.book-edge-stack {
  position: absolute;
  top: 6px;
  bottom: 6px;
  pointer-events: none;
  z-index: 20;
  transition: width .3s cubic-bezier(.25,.8,.25,1), opacity .25s ease;
  opacity: 1;
  display: block;
  box-sizing: border-box;
}
.book-edge-stack[style*="display: none"],
.book-edge-stack[style*="width: 0px"],
.book.is-cover .book-edge-stack,
.book.is-back-cover .book-edge-stack,
.book.is-cover #bookEdgeLeft,
.book.is-cover #bookEdgeRight,
.book.is-back-cover #bookEdgeLeft,
.book.is-back-cover #bookEdgeRight {
  display: none !important;
  opacity: 0 !important;
  box-shadow: none !important;
  border: none !important;
  visibility: hidden !important;
  width: 0 !important;
}
.book-edge-left {
  right: 100%;
}
.book-edge-right {
  left: 100%;
}

/* 每一层书页厚度阶梯 (Multi-tier Stepped Edge Layers) */
.book-edge-layer {
  box-sizing: border-box;
  transition: all .2s cubic-bezier(.25,.8,.25,1);
  border-radius: 4px;
}
.book-edge-left .book-edge-layer {
  border-radius: 5px 0 0 5px;
  border-left: 1.5px solid var(--border);
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  background: repeating-linear-gradient(
    90deg,
    var(--card) 0px,
    var(--card) 1.5px,
    rgba(0,0,0,0.15) 2px,
    var(--panel2) 3px,
    var(--panel2) 4.5px
  );
  box-shadow: -4px 6px 14px rgba(0,0,0,0.32), inset -2px 0 4px rgba(0,0,0,0.12);
}
.book-edge-right .book-edge-layer {
  border-radius: 0 5px 5px 0;
  border-right: 1.5px solid var(--border);
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  background: repeating-linear-gradient(
    90deg,
    var(--panel2) 0px,
    var(--panel2) 1.5px,
    rgba(0,0,0,0.15) 2px,
    var(--card) 3px,
    var(--card) 4.5px
  );
  box-shadow: 4px 6px 14px rgba(0,0,0,0.32), inset 2px 0 4px rgba(0,0,0,0.12);
}

/* 次级层与深层阶梯阴影与明暗递进 */
.edge-tier-1 { z-index: 12; }
.edge-tier-2 { z-index: 10; opacity: 0.90; }
.edge-tier-3 { z-index: 8;  opacity: 0.80; }
.edge-tier-4 { z-index: 6;  opacity: 0.70; }

/* 暗色主题下的多层物理厚度发光与阶梯分层线 (明确多页阶梯立体轮廓) */
[data-theme="dark"] .book-edge-left .book-edge-layer {
  border-left: 1.5px solid rgba(56, 189, 248, 0.85);
  border-top: 1px solid rgba(56, 189, 248, 0.4);
  border-bottom: 1px solid rgba(56, 189, 248, 0.4);
  background: repeating-linear-gradient(
    90deg,
    #1e293b 0px,
    #1e293b 1.5px,
    rgba(56, 189, 248, 0.35) 2px,
    #0f172a 2.5px,
    #0f172a 4.5px
  );
  box-shadow: -5px 0 10px rgba(0,0,0,0.9), -2px 0 6px rgba(56,189,248,0.4);
}
[data-theme="dark"] .book-edge-right .book-edge-layer {
  border-right: 1.5px solid rgba(56, 189, 248, 0.85);
  border-top: 1px solid rgba(56, 189, 248, 0.4);
  border-bottom: 1px solid rgba(56, 189, 248, 0.4);
  background: repeating-linear-gradient(
    90deg,
    #0f172a 0px,
    #0f172a 1.5px,
    rgba(56, 189, 248, 0.35) 2px,
    #1e293b 2.5px,
    #1e293b 4.5px
  );
  box-shadow: 5px 0 10px rgba(0,0,0,0.9), 2px 0 6px rgba(56,189,248,0.4);
}
[data-theme="dark"] .edge-tier-1 { border-color: rgba(56, 189, 248, 0.95); }
[data-theme="dark"] .edge-tier-2 { border-color: rgba(96, 165, 250, 0.85); opacity: 0.95; }
[data-theme="dark"] .edge-tier-3 { border-color: rgba(129, 140, 248, 0.75); opacity: 0.88; }
[data-theme="dark"] .edge-tier-4 { border-color: rgba(168, 85, 247, 0.65); opacity: 0.8; }

/* 7. 大屏自动巡航放映模式控制栏 (Auto-Presenter Bar) - 主题色系自适应 */
.presenter-bar {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 450;
  display: flex;
  align-items: center;
  gap: 14px;
  background: var(--panel);
  border: 1px solid var(--border);
  box-shadow: 0 8px 32px rgba(0,0,0,0.4), 0 0 20px rgba(79,140,255,0.18);
  padding: 8px 20px;
  border-radius: 30px;
  color: var(--text);
  font-size: 13px;
  transition: all .3s ease;
}
.presenter-bar.hidden { display: none; }
.pb-badge { font-weight: 700; color: var(--accent); display: flex; align-items: center; gap: 6px; }
.pb-info { font-family: var(--mono); font-size: 12px; color: var(--dim); }
.pb-progress { width: 110px; height: 6px; background: var(--border); border-radius: 4px; overflow: hidden; }
.pb-progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width 0.1s linear; }

.book-page-no {
  display: none !important;
}
.book-hint { position: absolute; top: -34px; right: 0; color: var(--faint); font-size: 12px; }

/* ============================ 左右双侧技术书签系统 (Left & Right Side Tabs) ============================ */
.book-side-col {
  position: absolute;
  top: 10px;
  bottom: 10px;
  width: 170px;
  display: flex;
  flex-direction: column;
  gap: 3.5px;
  overflow-y: auto;
  overflow-x: hidden;
  z-index: 45;
  scrollbar-width: none;
  pointer-events: auto;
  opacity: 0;
  contain: layout style paint;
  isolation: isolate;
  transition: opacity 0.12s ease-out;
}
.book-side-col::-webkit-scrollbar { display: none; }
.book-side-left {
  left: -170px;
  align-items: flex-end;
}
.book-side-right {
  right: -170px;
  align-items: flex-start;
}
.book-side-col.is-revealed,
.book-side-col:hover {
  opacity: 1;
}
.edge-tab {
  position: relative;
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: flex-start;
  gap: 6px;
  width: 94px;
  height: 24px;
  padding: 0 8px;
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--text);
  font-size: 11px;
  cursor: pointer;
  user-select: none;
  box-shadow: 0 2px 6px rgba(0,0,0,.15);
  flex-shrink: 0;
  box-sizing: border-box;
  pointer-events: auto;
  contain: layout style paint;
  transition: width 0.08s cubic-bezier(0.2, 0.8, 0.2, 1), background 0.05s, box-shadow 0.08s;
}
.book-side-left .edge-tab {
  border-radius: 6px 0 0 6px;
  border-right: none;
  border-left: 4px solid var(--tab-color, var(--accent));
}
.book-side-left .edge-tab:hover {
  width: 150px;
  background: var(--panel2);
  border-color: var(--tab-color, var(--accent));
  box-shadow: -4px 4px 14px rgba(0,0,0,.3);
  z-index: 10;
}
.book-side-right .edge-tab {
  border-radius: 0 6px 6px 0;
  border-left: none;
  border-right: 4px solid var(--tab-color, var(--accent));
}
.book-side-right .edge-tab:hover {
  width: 150px;
  background: var(--panel2);
  border-color: var(--tab-color, var(--accent));
  box-shadow: 4px 4px 14px rgba(0,0,0,.3);
  z-index: 10;
}
.edge-tab .et-no {
  font-family: var(--mono);
  font-size: 11px;
  line-height: 1;
  font-weight: 800;
  flex-shrink: 0;
}
.edge-tab .et-name {
  font-size: 11.5px;
  font-family: var(--font);
  line-height: 1;
  color: var(--text);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex: 1;
  text-align: left;
}
.edge-tab:hover .et-name {
  color: var(--tab-color, var(--accent));
}

/* 页面跳转闪烁提示 (Page Flash Animation) */
@keyframes pageFlashAnim {
  0% { box-shadow: inset 0 0 0 3px var(--accent), 0 0 24px rgba(79,140,255,.6); }
  70% { box-shadow: inset 0 0 0 2px var(--accent), 0 0 12px rgba(79,140,255,.3); }
  100% { box-shadow: var(--shadow); }
}
.page-flash {
  animation: pageFlashAnim 1.2s cubic-bezier(.25,.7,.3,1);
}

@media (max-width: 1180px) {
  .book-side-col { display: none; }
}

/* ============================ 页面内容排版 ============================ */
.page-title { font-size: 28px; font-weight: 800; letter-spacing: 1px; margin-bottom: 8px; }
.page-subtitle { font-size: 14.5px; color: var(--dim); margin-bottom: 22px; }
.h-rule { height: 3px; width: 64px; border-radius: 3px; background: linear-gradient(90deg, var(--accent), var(--accent2)); margin-bottom: 20px; }
.pg-section { margin-bottom: 20px; }
.pg-h { font-size: 17.5px; font-weight: 700; color: var(--accent); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
.pg-h::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--accent2); }
.pg-p { color: var(--text); margin-bottom: 10px; font-size: 14.5px; line-height: 1.8; }
.pg-p.dim { color: var(--dim); }
.pg-list { list-style: none; }
.pg-list li { position: relative; padding-left: 18px; margin-bottom: 9px; color: var(--text); font-size: 14.5px; line-height: 1.8; }
.pg-list li::before { content: "▸"; position: absolute; left: 0; color: var(--accent2); }
.badge { display: inline-block; padding: 3px 12px; border-radius: 20px; font-size: 13px; border: 1px solid var(--border2); color: var(--dim); font-weight: 600; }
.badge.high { color: var(--bad); border-color: var(--bad); }
.badge.mid  { color: var(--warn); border-color: var(--warn); }
.badge.low  { color: var(--good); border-color: var(--good); }
.badge.acc  { color: var(--accent2); border-color: var(--accent2); }
.stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin: 20px 0; }
.stat { background: var(--panel2); border: 1px solid var(--border); border-radius: 12px; padding: 16px; text-align: center; }
.stat .num { font-size: 28px; font-weight: 800; color: var(--accent2); font-family: var(--mono); }
.stat .lbl { font-size: 13.5px; color: var(--dim); margin-top: 5px; }

.timeline { position: relative; padding-left: 22px; }
.timeline::before { content: ""; position: absolute; left: 6px; top: 4px; bottom: 4px; width: 2px; background: var(--border2); }
.tl-item { position: relative; margin-bottom: 18px; }
.tl-item::before { content: ""; position: absolute; left: -22px; top: 5px; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px var(--panel); }
.tl-time { font-size: 13px; color: var(--accent2); font-family: var(--mono); font-weight: 700; }
.tl-title { font-weight: 700; font-size: 15.5px; margin: 3px 0 5px; }
.tl-items { color: var(--dim); font-size: 14px; line-height: 1.7; }

.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th, .tbl td { padding: 10px 14px; border: 1px solid var(--border); text-align: left; }
.tbl th { background: var(--panel2); color: var(--dim); font-weight: 700; white-space: nowrap; font-size: 14px; }
.tbl td { color: var(--text); line-height: 1.65; }
.tbl tr:nth-child(even) td { background: var(--panel2); }
.score-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }

/* 页角实体物理页码 (平时正常显示，当书页卷角悬停时自动淡出隐藏，移开卷角时立即恢复) */
.corner-page-no {
  position: absolute;
  bottom: 14px;
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 700;
  color: var(--dim);
  letter-spacing: 0.5px;
  user-select: none;
  pointer-events: none;
  z-index: 25;
  opacity: 0.85;
  transition: opacity 0.18s ease, visibility 0.18s ease;
}
.corner-page-no-l {
  left: 24px;
}
.corner-page-no-r {
  right: 24px;
}

/* 卷角悬停时精准淡出对应的页码 */
.corner-peek-l:hover ~ .corner-page-no-l,
.corner-peek-r:hover ~ .corner-page-no-r,
#pageLeft:has(.corner-peek-l:hover) .corner-page-no-l,
#pageRight:has(.corner-peek-r:hover) .corner-page-no-r {
  opacity: 0 !important;
  visibility: hidden !important;
}

.book-page.page-blank .corner-page-no,
.book.is-cover .corner-page-no,
.book.is-back-cover .corner-page-no {
  display: none !important;
  visibility: hidden !important;
}

/* 保证层级药丸与表格层级列绝不折行 */
.pill-tier {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap !important;
  word-break: keep-all !important;
  flex: none;
}
.tbl-sources {
  width: 100% !important;
  table-layout: fixed !important;
  font-size: 12px !important;
}
.tbl-sources th, .tbl-sources td {
  padding: 6px 3px !important;
  text-align: center !important;
}
.tbl-sources th:first-child, .tbl-sources td:first-child {
  text-align: left !important;
  padding-left: 8px !important;
}
.tbl-library-preview th, .tbl-library-preview td {
  padding: 8px 6px !important;
  font-size: 12.5px;
}

.cards { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.card { background: var(--panel2); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
.card .c-title { font-weight: 800; font-size: 15.5px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
.card .c-comment { font-size: 13.5px; line-height: 1.7; color: var(--dim); }

.bar { height: 9px; border-radius: 6px; background: var(--border); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 6px; background: linear-gradient(90deg, var(--accent), var(--accent2)); }

/* ============================ 网页视图（左侧目录 + 右侧内容） ============================ */
.web-layout { position: absolute; inset: 0; display: flex; }
.web-toc {
  width: 300px; flex: none; overflow-y: auto; border-right: 1px solid var(--border);
  background: var(--panel); padding: 14px 0 30px;
}
.web-toc h3 { padding: 6px 20px 12px; font-size: 13px; color: var(--dim); letter-spacing: 1px; }
.web-toc-item {
  display: flex; align-items: center; gap: 8px; padding: 8px 20px; cursor: pointer;
  color: var(--text); font-size: 13px; border-left: 3px solid transparent; transition: .15s;
}
.web-toc-item:hover { background: var(--panel2); color: var(--accent); }
.web-toc-item.active { background: var(--panel2); color: var(--accent); border-left-color: var(--accent); font-weight: 700; }
.web-toc-item .wt-no { font-family: var(--mono); color: var(--accent2); font-size: 12px; width: 34px; flex: none; }
.web-toc-item.part { font-weight: 800; color: var(--accent); margin-top: 8px; font-size: 14px; }
.web-toc-item.sub { padding-left: 36px; font-size: 12.5px; }
.web-content { flex: 1; overflow-y: auto; padding: 20px 32px 60px; }

.sec { width: 100%; max-width: 100%; margin: 14px 0 24px; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-sm); overflow: hidden; }
.sec-head { display: flex; align-items: center; gap: 12px; padding: 18px 24px; border-bottom: 1px solid var(--border); background: var(--panel2); }
.sec-no { font-family: var(--mono); color: var(--accent2); font-weight: 700; }
.sec-title { font-weight: 700; font-size: 17px; flex: 1; }
.sec-body { padding: 22px 24px; }

/* ============================ 面板 / 覆盖层 ============================ */
.overlay {
  position: fixed; inset: 0; z-index: 200;
  background: radial-gradient(circle at center, rgba(15, 23, 42, 0.92) 0%, rgba(3, 7, 18, 0.98) 100%);
  display: flex; align-items: center; justify-content: center; padding: 14px;
  opacity: 1;
  transition: opacity 0.22s ease;
}
.overlay.hidden { display: none !important; }
.overlay.is-closing { opacity: 0; pointer-events: none; }

.panel {
  width: 98vw; height: 96vh; max-width: 2000px; background: var(--panel);
  border-radius: 16px; box-shadow: 0 25px 80px rgba(0, 0, 0, 0.85);
  display: flex; flex-direction: column; position: relative;
}
.panel-head { display: flex; align-items: center; padding: 16px 26px; border-bottom: 1px solid var(--border); gap: 14px; flex: none; border-top-left-radius: 16px; border-top-right-radius: 16px; background: var(--panel2); }
.panel-title { font-weight: 800; font-size: 22px; flex: 1; min-width: 0; }
.panel-close { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 18px; flex: none; transition: .2s; cursor: pointer; }
.panel-close:hover { border-color: var(--bad); color: var(--bad); }
.panel-body { flex: 1; overflow: auto; padding: 20px 24px; border-bottom-left-radius: 16px; border-bottom-right-radius: 16px; }
.panel-body.flex { display: flex; flex-direction: column; overflow: hidden; padding: 0; }

/* 专题视窗顶栏详细技术标题 (1.5x 放大) */
.panel-tech-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; flex: 1; min-width: 0; }
.panel-tech-head .pth-id {
  font-family: var(--mono);
  font-size: 16px;
  font-weight: 800;
  color: #fff;
  background: var(--accent);
  padding: 4px 12px;
  border-radius: 8px;
  box-shadow: 0 0 12px rgba(79, 140, 255, 0.5);
  flex: none;
}
.panel-tech-head .pth-title { font-size: 23px; font-weight: 800; color: var(--text); letter-spacing: .4px; }
.panel-tech-head .tag { font-size: 14.5px; padding: 4px 12px; }
.panel-tech-head .pill { font-size: 14.5px; padding: 4px 12px; }
.panel-tech-head .badge { font-size: 14.5px; padding: 4px 12px; }

/* 弹窗 */
.modal { width: min(1000px, 96vw); max-height: 90vh; background: var(--panel); border-radius: 16px; box-shadow: 0 25px 80px rgba(0, 0, 0, 0.85); display: flex; flex-direction: column; position: relative; }
.modal-head { display: flex; align-items: center; padding: 18px 26px; border-bottom: 1px solid var(--border); border-top-left-radius: 16px; border-top-right-radius: 16px; background: var(--panel2); }
.modal-head .panel-title { flex: 1; font-size: 22px; font-weight: 800; }
.modal-body { padding: 24px; overflow: auto; border-bottom-left-radius: 16px; border-bottom-right-radius: 16px; }

/* 灯箱 */
.lightbox-toolbar { display: flex; align-items: center; gap: 12px; width: min(1200px, 94vw); color: var(--text); }
.lightbox-toolbar span { flex: 1; font-size: 14px; }
#lightboxImg { max-width: 94vw; max-height: 84vh; border-radius: 10px; background: #fff; box-shadow: var(--shadow); }

/* ============================ 长名单表格 ============================ */
.lib-toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
.lib-toolbar input, .lib-toolbar select {
  height: 34px; border-radius: 9px; border: 1px solid var(--border); background: var(--card);
  color: var(--text); padding: 0 12px; font-size: 13px; outline: none;
}
.lib-toolbar input { flex: 1; min-width: 200px; }
.lib-count { color: var(--dim); font-size: 13px; margin-left: auto; }
.lib-table-wrap { overflow: auto; border: 1px solid var(--border); border-radius: 12px; }
.lib-table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 1280px; }
.lib-table th, .lib-table td { padding: 9px 11px; border-bottom: 1px solid var(--border); text-align: left; white-space: nowrap; }
.lib-table th { background: var(--panel2); color: var(--dim); position: sticky; top: 0; cursor: pointer; user-select: none; transition: .15s; }
.lib-table th:hover { color: var(--accent); }
.lib-table th.sorted { color: var(--accent); font-weight: 700; background: var(--panel); }
.lib-table th.col-score, .lib-table td.col-score { text-align: center; padding: 9px 6px; }
.lib-table tr:hover td { background: var(--panel2); }
.lib-table td .tname { font-weight: 600; color: var(--text); }
.tag { display: inline-block; padding: 2px 9px; border-radius: 6px; font-size: 12px; border: 1px solid var(--border2); color: var(--dim); }
.pill { display: inline-block; min-width: 20px; text-align: center; padding: 1px 8px; border-radius: 20px; font-size: 12px; font-weight: 600; }
.pill.s5 { background: rgba(52,211,153,.18); color: var(--good); }
.pill.s4 { background: rgba(34,211,238,.18); color: var(--accent2); }
.pill.s3 { background: rgba(251,191,36,.18); color: var(--warn); }
.pill.s2 { background: rgba(251,146,60,.18); color: #fb923c; }
.pill.s1 { background: rgba(251,113,133,.18); color: var(--bad); }
.sixdim { display: grid; grid-template-columns: repeat(3, auto); gap: 3px 6px; }
.sixdim .sd { font-size: 10.5px; padding: 1px 5px; border-radius: 4px; white-space: nowrap; font-weight: 600; }
.sixdim .sd.s5 { background: rgba(52,211,153,.18); color: var(--good); }
.sixdim .sd.s4 { background: rgba(34,211,238,.18); color: var(--accent2); }
.sixdim .sd.s3 { background: rgba(251,191,36,.18); color: var(--warn); }
.sixdim .sd.s2 { background: rgba(251,146,60,.18); color: #fb923c; }
.sixdim .sd.s1 { background: rgba(251,113,133,.18); color: var(--bad); }
.pill-tier { border-radius: 6px; padding: 2px 8px; font-size: 12px; font-weight: 700; }
.pager { display: flex; gap: 8px; align-items: center; justify-content: center; margin-top: 14px; color: var(--dim); font-size: 13px; }
.pager button { border: 1px solid var(--border); background: var(--card); color: var(--text); border-radius: 8px; padding: 5px 12px; }
.pager button:disabled { opacity: .4; cursor: default; }
.row-detail { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 22px; }
.row-detail .rd { padding: 8px 0; border-bottom: 1px dashed var(--border); }
.row-detail .rd .k { color: var(--dim); font-size: 12px; }
.row-detail .rd .v { font-size: 14px; margin-top: 2px; }
.row-detail .rd.full { grid-column: 1 / -1; }

/* ============================ 图谱 ============================ */
.graph-toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--dim); }
.legend .lg { display: flex; align-items: center; gap: 5px; cursor: pointer; user-select: none; }
.legend .lg .dot { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
.legend .lg .line { width: 16px; height: 3px; border-radius: 2px; display: inline-block; }
.legend .lg.off { opacity: .3; }
#graphBox { position: relative; width: 100%; height: min(66vh, 640px); border: 1px solid var(--border); border-radius: 12px; background: var(--bg2); overflow: hidden; cursor: grab; }
#graphBox svg { width: 100%; height: 100%; display: block; }
#graphBox.dragging { cursor: grabbing; }
.graph-tip { color: var(--faint); font-size: 12px; }

/* ============================ 图表 ============================ */
.charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.chart-card { background: var(--panel2); border: 1px solid var(--border); border-radius: 12px; padding: 14px; }
.chart-card h4 { font-size: 14px; margin-bottom: 10px; color: var(--dim); }
.chart-card svg { width: 100%; height: 260px; }

/* ============================ 技术专题详情 ============================ */
.tech-detail { display: flex; flex-direction: column; flex: 1; min-height: 0; height: 100%; }
.tech-detail-bar { flex: none; padding: 12px 20px 10px; border-bottom: 1px solid var(--border); }
.tech-detail-bar .tech-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.tech-detail-bar .tech-head h2 { font-size: 24px; }
.tabs { flex: none; display: flex; gap: 10px; padding: 0 24px; border-bottom: 1px solid var(--border); background: var(--panel2); }
.tab { padding: 14px 28px; border: none; background: transparent; color: var(--dim); font-size: 17.5px; border-bottom: 3.5px solid transparent; cursor: pointer; font-weight: 700; transition: .2s; }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 800; }
.tech-detail-body { flex: 1; overflow: auto; padding: 24px 28px; min-height: 0; display: flex; flex-direction: column; }
.tabpane { display: none; }
.tabpane.active { display: block; }
.tabpane.active.fill { display: flex; flex-direction: column; flex: 1; min-height: 0; height: 100%; }

/* 评估表大屏自适应布局 (Assess Dashboard - 1.5x 放大版) */
.assess-dashboard { display: grid; grid-template-columns: 440px 1fr; gap: 24px; align-items: start; }
@media (max-width: 1200px) { .assess-dashboard { grid-template-columns: 1fr; } }
.assess-side { display: flex; flex-direction: column; gap: 20px; }
.assess-main { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.assess-radar-card { padding: 20px 22px 14px; text-align: center; }
.assess-radar-card h4 { margin-bottom: 8px; font-size: 18px; color: var(--dim); font-weight: 800; }
.assess-radar-card svg { width: 100%; height: 280px; }
.assess-conclusion-card { padding: 20px 24px; border-left: 5px solid var(--accent); }
.assess-conclusion-card .acc-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.assess-conclusion-card .acc-head h4 { font-size: 18.5px; font-weight: 800; color: var(--text); margin: 0; }
.assess-conclusion-card .acc-tags { display: flex; gap: 8px; align-items: center; }
.assess-conclusion-card .acc-body { font-size: 16.5px; line-height: 1.85; color: var(--text); font-weight: 500; }

/* 六维评分与依据一体化对照表 (1.5x 放大) */
.assess-table-card { padding: 20px 24px; }
.assess-table-card h4 { font-size: 19px; margin-bottom: 14px; color: var(--text); font-weight: 800; }
.assess-tbl-wrap { overflow-x: auto; border-radius: 12px; border: 1px solid var(--border); }
.assess-tbl { width: 100%; border-collapse: collapse; font-size: 16.5px; }
.assess-tbl th { background: var(--panel2); color: var(--dim); padding: 13px 18px; font-weight: 800; font-size: 16px; border-bottom: 1px solid var(--border); white-space: nowrap; text-align: left; }
.assess-tbl td { padding: 13px 18px; border-bottom: 1px solid var(--border); vertical-align: middle; line-height: 1.7; }
.assess-tbl tr:last-child td { border-bottom: none; }
.assess-tbl tr:hover td { background: var(--panel2); }
.assess-tbl .td-dim { white-space: nowrap; }
.assess-tbl .td-dim b { display: block; font-size: 17.5px; color: var(--text); font-weight: 800; }
.assess-tbl .td-dim .dim-w { display: inline-block; font-size: 13px; color: var(--dim); background: var(--card); padding: 2px 8px; border-radius: 6px; margin-top: 4px; border: 1px solid var(--border2); }
.assess-tbl .td-score { white-space: nowrap; }
.assess-tbl .score-cell { display: flex; flex-direction: column; gap: 5px; }
.assess-tbl .score-num { font-weight: 800; font-size: 17.5px; font-family: var(--mono); }
.assess-tbl .td-basis { font-size: 16px; color: var(--text); line-height: 1.75; }

/* 底部精简研判卡片网格 (1.5x 放大) */
.assess-info-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; }
@media (max-width: 960px) { .assess-info-grid { grid-template-columns: 1fr; } }
.assess-info-card { background: var(--panel2); border: 1px solid var(--border); border-radius: 14px; padding: 18px 22px; }
.assess-info-card .aic-h { font-size: 17.5px; font-weight: 800; color: var(--text); margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
.assess-info-card .aic-p { font-size: 16px; line-height: 1.8; color: var(--text); }
.assess-info-card .aic-p ul.tech-box-list { margin: 0; padding-left: 18px; list-style: disc; }
.assess-info-card .aic-p ul.tech-box-list li { margin-bottom: 6px; font-size: 16px; }
.onepage-wrap { text-align: center; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
.onepage-wrap img { max-width: 100%; max-height: 100%; border: 1px solid var(--border); border-radius: 12px; cursor: zoom-in; background: #fff; object-fit: contain; }
.onepage-stage { display: flex; align-items: center; justify-content: center; background: var(--bg2); padding: 14px; flex: 1; min-height: 0; height: 100%; }
.onepage-stage:fullscreen { background: #0b1120; padding: 24px; }
.onepage-stage:-webkit-full-screen { background: #0b1120; padding: 24px; }
.preview-toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; flex: none; }
.preview-toolbar a, .preview-toolbar button { display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 9px; border: 1px solid var(--accent); color: var(--accent); text-decoration: none; font-size: 15px; font-weight: 600; }
.preview-toolbar a:hover, .preview-toolbar button:hover { background: var(--accent); color: #fff; }
.preview-stage { flex: 1; min-height: 0; width: 100%; height: 100%; border: 1px solid var(--border); border-radius: 12px; background: #fff; position: relative; overflow: hidden; }
.preview-stage iframe { width: 100%; height: 100%; min-height: 520px; border: 0; display: block; }
.preview-stage:fullscreen { background: #fff; }
.preview-stage:-webkit-full-screen { background: #fff; }
.preview-empty { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; color: var(--dim); font-size: 16px; text-align: center; padding: 24px; border: 1px dashed var(--border2); border-radius: 12px; }
.tech-sum { background: var(--panel2); border-left: 3px solid var(--accent); padding: 12px 16px; border-radius: 0 10px 10px 0; margin-bottom: 16px; color: var(--text); }

/* ============================ 书籍模式专享：纵向流式排版 (Vertical Book Layout) ============================ */
.book-tech-pad {
  padding: 24px 28px 28px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-height: 100%;
}
.bk-head {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.bk-title-row {
  display: flex;
  align-items: center;
  gap: 10px;
}
.bk-no {
  font-family: var(--mono);
  font-weight: 800;
  font-size: 14px;
  background: var(--panel2);
  color: var(--accent);
  border: 1px solid var(--accent);
  padding: 3px 10px;
  border-radius: 6px;
}
.bk-name {
  font-size: 20px;
  font-weight: 800;
  color: var(--text);
  flex: 1;
  letter-spacing: .3px;
}
.bk-btn {
  margin-left: auto;
}
.bk-tags-row {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.bk-section {
  background: var(--panel2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 11px 16px;
}
.bk-sec-title {
  font-size: 13.5px;
  font-weight: 800;
  color: var(--accent);
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.bk-sec-title .icon { font-size: 14px; }
.bk-sec-body {
  font-size: 13.5px;
  line-height: 1.7;
  color: var(--text);
}

.bk-def   { border-left: 4px solid var(--accent); background: linear-gradient(90deg, rgba(79,140,255,.08), var(--panel2)); }
.bk-trend { border-left: 4px solid #8b5cf6; }
.bk-value { border-left: 4px solid var(--good); }
.bk-limit { border-left: 4px solid var(--bad); }

.bk-middle-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  align-items: stretch;
}
.bk-radar-col {
  width: 100%;
  box-sizing: border-box;
  background: var(--panel2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.bk-radar-col .bk-sec-title {
  align-self: flex-start;
  margin-bottom: 4px;
}
.bk-radar-box {
  width: 100%;
  height: 240px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.bk-radar-box svg {
  width: 100%;
  height: 100%;
  max-width: 330px;
}
.bk-conclusion-col {
  background: linear-gradient(180deg, var(--panel2), var(--card));
  border: 1px solid var(--border);
  border-left: 4px solid var(--accent2);
  border-radius: 10px;
  padding: 12px 16px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.bk-conclusion-text {
  font-size: 13.5px;
  line-height: 1.72;
  color: var(--text);
  text-align: justify;
}
.bk-scores-grid {
  margin-top: 10px;
}
.bk-scores-grid .sixdim {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px 8px;
}
.bk-scores-grid .sixdim .sd {
  font-size: 12px;
  padding: 3px 6px;
  text-align: center;
}

/* ============================ 网页模式专享：横向大屏仪表盘 (Horizontal Web Layout) ============================ */
.web-tech-container {
  padding: 4px 0;
}
.web-tech-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
}
.web-tech-layout {
  display: grid;
  grid-template-columns: 350px 1fr;
  gap: 14px;
  align-items: stretch;
}
.web-col-dash {
  display: flex;
  flex-direction: column;
}
.web-col-content {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.bento-card {
  background: var(--panel2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 11px 14px;
  display: flex;
  flex-direction: column;
  position: relative;
  transition: border-color .2s;
}
.bento-card:hover {
  border-color: var(--border2);
}
.bento-card-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--accent);
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.bento-card-title .icon { font-size: 13px; }
.bento-card-body {
  font-size: 12px;
  line-height: 1.6;
  color: var(--text);
  flex: 1;
}

.radar-card {
  align-items: center;
  padding: 10px 12px;
}
.radar-card .bento-card-title { align-self: flex-start; }
.radar-box { width: 100%; display: flex; justify-content: center; align-items: center; }
.radar-box svg { width: 100%; max-width: 320px; height: 220px; }
.radar-scores-mini { width: 100%; margin-top: 6px; }
.radar-scores-mini .sixdim { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px 6px; }
.radar-scores-mini .sixdim .sd { text-align: center; }

.conclusion-card {
  background: linear-gradient(180deg, var(--panel2), var(--card));
  border-left: 3px solid var(--accent2);
}
.conclusion-card .bento-card-title { color: var(--accent2); }
.conclusion-text {
  font-size: 12px;
  line-height: 1.6;
  color: var(--text);
  text-align: justify;
}

.def-card   { border-top: 2px solid var(--accent); }
.trend-card { border-top: 2px solid #8b5cf6; }
.value-card { border-top: 2px solid var(--good); }
.limit-card { border-top: 2px solid var(--bad); }

.pill-disposal { font-size: 11.5px; padding: 2px 8px; border-radius: 6px; background: rgba(79,140,255,.14); color: var(--accent); border: 1px solid rgba(79,140,255,.35); font-weight: 600; }
.pill-dim { font-size: 11.5px; padding: 2px 8px; border-radius: 6px; background: var(--panel2); color: var(--dim); border: 1px solid var(--border); }
.pill-attr { font-size: 11.5px; padding: 2px 8px; border-radius: 6px; background: var(--panel2); color: var(--accent2); border: 1px solid var(--border); }
.btn-sm { height: 28px; padding: 0 10px; font-size: 12px; }

.tech-box-list {
  list-style: none;
  margin: 0;
  padding: 0;
}
.tech-box-list li {
  position: relative;
  padding-left: 13px;
  margin-bottom: 3px;
  font-size: 11.5px;
  line-height: 1.48;
  color: var(--text);
}
.tech-box-list li:last-child { margin-bottom: 0; }
.tech-box-list li::before {
  content: "▸";
  position: absolute;
  left: 0;
  top: 0;
  color: var(--accent);
  font-size: 11px;
}
.tech-box-list li .hl {
  color: var(--accent2);
  font-weight: 700;
  margin-right: 2px;
}
.tech-box-text {
  font-size: 11.5px;
  line-height: 1.5;
  color: var(--text);
}

/* ============================ 封面 / 篇章页 ============================ */
.cover-full {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
  justify-content: center; text-align: center; padding: 40px; overflow: hidden;
  background: radial-gradient(130% 100% at 50% 0%, #1d2d52 0%, #0e172b 52%, #090f1c 100%);
  color: #eaf1ff;
}
.cover-full .cov-kicker { letter-spacing: 7px; color: #4f8cff; font-size: 13px; margin-bottom: 20px; text-transform: uppercase; }
.cover-full .cov-title { font-size: clamp(26px, 3.4vw, 42px); font-weight: 800; letter-spacing: 5px; line-height: 1.35; }
.cover-full .cov-sub { margin-top: 16px; color: #b9c9e8; font-size: 15px; letter-spacing: 2px; }
.cover-full .cov-rule { width: 120px; height: 3px; border-radius: 3px; margin: 26px 0; background: linear-gradient(90deg, #4f8cff, #22d3ee); }
.cover-full .cov-meta { color: #8fa3c0; font-size: 13px; letter-spacing: 1px; line-height: 2.1; }
.cover-orb { position: absolute; border-radius: 50%; filter: blur(3px); opacity: .45; pointer-events: none; }
.divider-full {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
  justify-content: center; text-align: center; padding: 40px; overflow: hidden;
  background: linear-gradient(160deg, var(--paper2), var(--paper));
}
.divider-full .dv-part { font-family: var(--mono); color: var(--accent2); letter-spacing: 5px; font-size: 14px; }
.divider-full .dv-title { font-size: clamp(26px, 3vw, 36px); font-weight: 800; letter-spacing: 8px; margin: 16px 0; color: var(--text); }
.divider-full .dv-desc { color: var(--dim); max-width: 440px; line-height: 1.9; font-size: 14px; }
.divider-full .dv-num { font-family: var(--mono); font-size: 150px; font-weight: 800; opacity: .07; position: absolute; right: 18px; bottom: -14px; line-height: 1; color: var(--text); }
/* ============================ 目录排版与超强激光扫描动效 ============================ */
.toc-list { list-style: none; display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
.toc-list li {
  position: relative;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5.5px 12px;
  border-radius: 6px;
  border: 1px solid transparent;
  border-bottom: 1px dashed var(--border);
  cursor: pointer;
  overflow: hidden;
  transition: all .18s cubic-bezier(0.16, 1, 0.3, 1);
  font-size: 13px;
}
.toc-list li::after {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  left: -120%;
  width: 60%;
  background: linear-gradient(
    90deg,
    transparent 0%,
    rgba(34, 211, 238, 0.4) 25%,
    rgba(255, 255, 255, 0.95) 50%,
    rgba(79, 140, 255, 0.85) 75%,
    transparent 100%
  );
  box-shadow: 0 0 20px rgba(34, 211, 238, 0.9), 0 0 35px rgba(79, 140, 255, 0.7);
  transform: skewX(-25deg);
  pointer-events: none;
  opacity: 0;
}
body.fx-enabled .toc-list li:hover::after {
  opacity: 1;
  animation: fxLaserSweep 0.65s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
@keyframes fxLaserSweep {
  0% { left: -120%; }
  100% { left: 160%; }
}
.toc-list li:hover {
  background: linear-gradient(90deg, rgba(79, 140, 255, 0.16), rgba(34, 211, 238, 0.1));
  border-color: rgba(79, 140, 255, 0.4);
  border-left: 3px solid var(--accent);
  box-shadow: 0 3px 12px rgba(79, 140, 255, 0.2);
  transform: translateX(4px);
}
.toc-list .toc-no {
  font-family: var(--mono);
  color: var(--accent2);
  font-size: 13px;
  width: 44px;
  flex: none;
  font-weight: 800;
  transition: color .2s;
}
.toc-list .toc-label {
  font-weight: 600;
  font-size: 13px;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: color .2s, text-shadow .2s;
}
.toc-list li:hover .toc-no {
  color: var(--accent);
}
.toc-list li:hover .toc-label {
  color: var(--accent);
  text-shadow: 0 0 10px rgba(79, 140, 255, 0.45);
}
.toc-list .toc-dots {
  flex: 1;
  border-bottom: 1.5px dotted var(--border2);
  height: 1px;
  margin: 0 8px;
  opacity: 0.55;
}
.toc-list .toc-page-num {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--dim);
  font-weight: 700;
  flex: none;
  padding: 1px 6px;
  border-radius: 4px;
  transition: all .2s;
}
.toc-list li:hover .toc-page-num {
  background: var(--accent);
  color: #fff;
  box-shadow: 0 0 8px rgba(79, 140, 255, 0.5);
}
.toc-list .toc-part {
  font-weight: 800;
  color: var(--accent);
  font-size: 13.5px;
  background: rgba(79, 140, 255, 0.08);
  margin-top: 5px;
  border-bottom: 1.5px solid var(--accent);
  padding: 6px 12px;
}
.toc-list .toc-indent {
  padding-left: 18px;
}

/* ============================ 全息毛玻璃视窗与滚动彩色光影勾边 ============================ */
/* 🌈 仅四条边流光勾边，中心背景纯净不流动 */
body.fx-enabled .panel::before,
body.fx-enabled .modal::before {
  content: "";
  position: absolute;
  inset: -2px;
  border-radius: 17px;
  background: linear-gradient(
    90deg,
    #38bdf8 0%,
    #818cf8 20%,
    #ec4899 40%,
    #f59e0b 60%,
    #10b981 80%,
    #38bdf8 100%
  );
  background-size: 300% 300%;
  animation: fxRainbowFlow 4s linear infinite;
  z-index: 10;
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  mask-composite: exclude;
  padding: 2px;
  pointer-events: none;
}

@keyframes fxRainbowFlow {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* 入场展开动效 */
@keyframes fxModalUnfold {
  0% {
    opacity: 0;
    transform: scale(0.84) translateY(36px) rotateX(8deg);
    filter: brightness(1.6);
  }
  65% {
    transform: scale(1.015) translateY(-3px) rotateX(-1deg);
    filter: brightness(1.15);
  }
  100% {
    opacity: 1;
    transform: scale(1) translateY(0) rotateX(0deg);
    filter: brightness(1);
  }
}

/* 退出关闭动效 */
@keyframes fxModalFold {
  0% {
    opacity: 1;
    transform: scale(1) translateY(0) rotateX(0deg);
  }
  100% {
    opacity: 0;
    transform: scale(0.88) translateY(24px) rotateX(-6deg);
    filter: blur(4px);
  }
}

body.fx-enabled .overlay:not(.hidden):not(.is-closing) .panel,
body.fx-enabled .overlay:not(.hidden):not(.is-closing) .modal {
  animation: fxModalUnfold 0.42s cubic-bezier(0.19, 1, 0.22, 1) both;
}

body.fx-enabled .overlay.is-closing .panel,
body.fx-enabled .overlay.is-closing .modal {
  animation: fxModalFold 0.22s cubic-bezier(0.4, 0, 1, 1) both;
}

/* ⚡ 弹出专题/弹窗时：彻底关停并隐藏所有背景与书籍耗电耗能动效，硬件资源 100% 专供专题视窗 */
body.has-overlay-open #fxCanvas {
  display: none !important;
}
body.has-overlay-open .book::before,
body.has-overlay-open #pageLeft,
body.has-overlay-open #pageRight,
body.has-overlay-open .book-edge-left,
body.has-overlay-open .book-edge-right,
body.has-overlay-open .corner-peek,
body.has-overlay-open .book-side-col,
body.has-overlay-open .book-side-tab {
  animation: none !important;
  transition: none !important;
}

/* ============================ Toast ============================ */
.toast { position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--border2); color: var(--text); padding: 10px 20px; border-radius: 20px; box-shadow: var(--shadow-sm); z-index: 400; font-size: 13px; }

/* ============================ 响应式 ============================ */
@media (max-width: 1100px) {
  .web-tech-layout { grid-template-columns: 1fr; }
  .web-col-content { grid-template-columns: 1fr; }
}
@media (max-width: 900px) {
  .book { width: 96vw; height: calc(100vh - var(--topbar-h) - 40px); }
  .book-page { width: 100%; border-radius: 14px; }
  #pageLeft { display: none; }
  #pageRight { left: 0; right: 0; }
  .cards, .charts-grid, .row-detail { grid-template-columns: 1fr; }
  .brand-sub { display: none; }
  .search-wrap { max-width: 180px; }
  .web-toc { width: 220px; }
  .tech-page-pad { padding: 16px; }
}
</style>
</head>
<body>

<canvas id="fxCanvas"></canvas>

<header class="topbar">
  <div class="brand" id="brandBtn" title="回到封面">
    <div class="brand-icon">研</div>
    <div class="brand-text">
      <div class="brand-title">科技发展部前沿技术研究成果集</div>
      <div class="brand-sub">电子研究书 · 书籍 / 网页</div>
    </div>
  </div>
  <div class="search-wrap">
    <input id="searchInput" type="text" placeholder="搜索技术名称 / 关键词，回车跳转…" autocomplete="off">
    <div id="searchResults" class="search-results hidden"></div>
  </div>
  <div class="topbar-actions">
    <button class="btn" id="btnAutoPlay" title="开启大屏自动放映巡航">▶ 自动放映</button>
    <button class="btn" id="btnFxToggle" title="切换炫酷动效增强模式">✨ 动效: 开</button>
    <button class="btn mode-btn active" id="btnBook" title="书籍模式">📖 书籍</button>
    <button class="btn mode-btn" id="btnWeb" title="网页模式">🌐 网页</button>
    <button class="btn" id="btnTheme" title="切换明暗主题">🌓 主题</button>
  </div>
</header>

<main id="bookView" class="view">
  <div class="book-stage">
    <div class="book" id="book">
      <div class="book-edge-stack book-edge-left" id="bookEdgeLeft"></div>
      <div class="book-edge-stack book-edge-right" id="bookEdgeRight"></div>
      <div class="book-side-col book-side-left" id="bookSideLeft"></div>
      <div class="book-side-col book-side-right" id="bookSideRight"></div>
      <div class="book-page" id="pageLeft">
        <div class="page-inner" id="pageLeftInner"></div>
        <div class="corner-peek corner-peek-l" id="cornerPeekL" title="点击向前翻页">
          <div class="curl-shadow"></div>
          <div class="curl-fold"><span class="curl-hint">‹ 翻页</span></div>
        </div>
        <div class="corner-page-no corner-page-no-l" id="cornerPageNoL"></div>
      </div>
      <div class="book-page" id="pageRight">
        <div class="page-inner" id="pageRightInner"></div>
        <div class="corner-peek corner-peek-r" id="cornerPeekR" title="点击向后翻页">
          <div class="curl-shadow"></div>
          <div class="curl-fold"><span class="curl-hint">翻页 ›</span></div>
        </div>
        <div class="corner-page-no corner-page-no-r" id="cornerPageNoR"></div>
      </div>
      <div class="book-turn-wrap" id="turnWrap">
        <div class="book-turn" id="turnSheet">
          <div class="turn-face turn-front">
            <div class="page-inner" id="turnFrontInner"></div>
            <div class="turn-sheen"></div>
          </div>
          <div class="turn-face turn-back">
            <div class="page-inner" id="turnBackInner"></div>
            <div class="turn-sheen"></div>
          </div>
        </div>
      </div>
      <div class="book-page-no" id="pageNo">封面</div>
    </div>
  </div>
</main>

<main id="webView" class="view hidden">
  <div class="web-layout">
    <aside class="web-toc" id="webToc"></aside>
    <div class="web-content" id="webContent"></div>
  </div>
</main>

<div class="overlay hidden" id="panel">
  <div class="panel">
    <div class="panel-head">
      <div class="panel-title" id="panelTitle"></div>
      <button class="panel-close" id="panelClose" title="关闭">✕</button>
    </div>
    <div class="panel-body" id="panelBody"></div>
  </div>
</div>

<div class="overlay hidden" id="lightbox">
  <div class="lightbox-toolbar">
    <span id="lightboxTitle"></span>
    <button class="panel-close" id="lightboxClose" title="关闭">✕</button>
  </div>
  <img id="lightboxImg" alt="预览图">
</div>

<div class="overlay hidden" id="modal">
  <div class="modal">
    <div class="modal-head"><div class="panel-title" id="modalTitle"></div><button class="panel-close" id="modalClose">✕</button></div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<!-- 大屏自动巡航控制栏 -->
<div id="presenterBar" class="presenter-bar hidden">
  <div class="pb-badge">🎬 自动放映巡航中</div>
  <div class="pb-info" id="pbInfo">第 1 / 48 页</div>
  <div class="pb-progress"><div class="pb-progress-fill" id="pbFill"></div></div>
  <button class="btn btn-sm active" id="pbExit">退出放映</button>
</div>

<div class="toast hidden" id="toast"></div>

<script src="data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
